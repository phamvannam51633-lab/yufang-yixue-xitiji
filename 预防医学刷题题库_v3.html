<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预防医学 · 刷题题库</title>
<style>
:root {
  --bg: #f5f0e8;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-secondary: #5a6c7d;
  --border: #e0d5c1;
  --accent: #1a6b8a;
  --accent-light: #e8f4f8;
  --correct: #1e8449;
  --correct-bg: #eafaf1;
  --wrong: #c0392b;
  --wrong-bg: #fdedec;
  --header-bg: #1a3c4a;
  --header-text: #ecf0f1;
  --option-hover: #f0f7fa;
  --option-selected: #d4eaf7;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --tag-bg: #e8f0f4;
  --tag-text: #1a6b8a;
  --progress-bg: #e0d5c1;
  --progress-fill: #1a6b8a;
  --btn-bg: #1a6b8a;
  --btn-text: #fff;
  --btn-hover: #155d78;
  --stats-bg: #faf7f2;
}
.dark {
  --bg: #1a1d23;
  --card-bg: #252830;
  --text: #e0e0e0;
  --text-secondary: #a0a8b4;
  --border: #3a3d44;
  --accent: #5dade2;
  --accent-light: #1c2d3a;
  --correct: #2ecc71;
  --correct-bg: #1a2e22;
  --wrong: #e74c3c;
  --wrong-bg: #2e1a1a;
  --header-bg: #15181f;
  --header-text: #ecf0f1;
  --option-hover: #2a2d35;
  --option-selected: #1c3040;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --tag-bg: #2a3040;
  --tag-text: #5dade2;
  --progress-bg: #3a3d44;
  --progress-fill: #5dade2;
  --btn-bg: #5dade2;
  --btn-text: #1a1d23;
  --btn-hover: #7ec8f0;
  --stats-bg: #1f2229;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
  min-height:100vh;
}
/* Header */
.header {
  background: var(--header-bg);
  color: var(--header-text);
  padding: 12px 24px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header h1 { font-size:18px; font-weight:600; letter-spacing:0.5px; }
.header-right { display:flex; align-items:center; gap:16px; }
.theme-btn {
  background: rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
  color: var(--header-text); padding:6px 14px; border-radius:20px;
  cursor:pointer; font-size:14px; transition:all 0.2s;
  display:flex; align-items:center; gap:6px;
}
.theme-btn:hover { background: rgba(255,255,255,0.22); }
/* Layout */
.container { max-width:900px; margin:0 auto; padding:20px; }
/* Stats bar */
.stats-bar {
  display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;
}
.stat-card {
  flex:1; min-width:100px; background:var(--stats-bg);
  border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; text-align:center;
}
.stat-num { font-size:24px; font-weight:700; color:var(--accent); }
.stat-label { font-size:12px; color:var(--text-secondary); margin-top:2px; }
/* Controls */
.controls {
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;
}
.chapter-select {
  flex:1; min-width:200px; padding:10px 14px;
  border:1px solid var(--border); border-radius:8px;
  font-size:14px; background:var(--card-bg); color:var(--text);
  cursor:pointer; outline:none;
}
.chapter-select:focus { border-color:var(--accent); }
.mode-btns { display:flex; gap:8px; }
.mode-btn {
  padding:8px 16px; border:1px solid var(--border); border-radius:8px;
  background:var(--card-bg); color:var(--text); cursor:pointer;
  font-size:13px; transition:all 0.2s;
}
.mode-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn {
  padding:10px 20px; border:none; border-radius:8px;
  background:var(--btn-bg); color:var(--btn-text);
  font-size:14px; cursor:pointer; transition:all 0.2s;
  font-weight:500;
}
.btn:hover { background:var(--btn-hover); }
.btn-outline {
  background:transparent; border:1px solid var(--accent);
  color:var(--accent);
}
.btn-outline:hover { background:var(--accent-light); }
/* Question card */
.question-card {
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:12px; padding:28px 28px 20px;
  box-shadow:var(--shadow); margin-bottom:16px;
  transition:background 0.3s;
}
.q-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
.q-num {
  background:var(--accent); color:#fff; border-radius:8px;
  padding:4px 10px; font-size:13px; font-weight:600; white-space:nowrap;
  flex-shrink:0;
}
.q-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.q-tag {
  font-size:11px; padding:2px 8px; border-radius:4px;
  background:var(--tag-bg); color:var(--tag-text);
}
.q-stem { font-size:17px; line-height:1.7; font-weight:500; word-wrap:break-word; overflow-wrap:break-word; }
/* Options */
.options { display:flex; flex-direction:column; gap:8px; margin:20px 0; }
.option {
  display:flex; align-items:flex-start; gap:12px; padding:14px 16px;
  border:1.5px solid var(--border); border-radius:10px;
  cursor:pointer; transition:all 0.15s;
  font-size:15px; line-height:1.5;
}
.option:hover { background:var(--option-hover); }
.option.selected { border-color:var(--accent); background:var(--option-selected); }
.option.correct { border-color:var(--correct); background:var(--correct-bg); }
.option.wrong { border-color:var(--wrong); background:var(--wrong-bg); }
.option-letter {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; flex-shrink:0;
  border:1.5px solid var(--border); background:var(--bg);
  transition:all 0.15s;
}
.option.selected .option-letter { background:var(--accent); color:#fff; border-color:var(--accent); }
.option.correct .option-letter { background:var(--correct); color:#fff; border-color:var(--correct); }
.option.wrong .option-letter { background:var(--wrong); color:#fff; border-color:var(--wrong); }
.option-text { padding-top:4px; word-wrap:break-word; overflow-wrap:break-word; min-width:0; flex:1; }
/* Answer reveal */
.answer-reveal {
  margin-top:16px; padding:16px 20px; border-radius:8px;
  background:var(--correct-bg); border-left:4px solid var(--correct);
  display:none;
}
.answer-reveal.show { display:block; }
.answer-reveal .ans-label { font-weight:700; color:var(--correct); font-size:15px; }
.answer-reveal .ans-detail { margin-top:4px; color:var(--text-secondary); font-size:14px; }
/* Navigation */
.nav-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; }
.nav-btns { display:flex; gap:8px; }
/* Progress bar */
.progress-bar {
  height:4px; background:var(--progress-bg); border-radius:2px;
  margin:16px 0; overflow:hidden;
}
.progress-fill {
  height:100%; background:var(--progress-fill); border-radius:2px;
  transition:width 0.3s;
}
/* Grid of questions */
.q-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(36px,1fr));
  gap:4px; margin-top:20px;
}
.q-dot {
  aspect-ratio:1; border-radius:4px; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; cursor:pointer; transition:all 0.15s;
  background:var(--card-bg); color:var(--text-secondary);
}
.q-dot:hover { border-color:var(--accent); }
.q-dot.current { border:2px solid var(--accent); font-weight:700; color:var(--accent); }
.q-dot.done-correct { background:var(--correct-bg); border-color:var(--correct); color:var(--correct); }
.q-dot.done-wrong { background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong); }
.q-dot.wrong-marked { position:relative; }
.q-dot.wrong-marked::after { content:'!'; position:absolute; top:-2px; right:-2px; font-size:8px; color:#fff; background:var(--wrong); border-radius:50%; width:14px; height:14px; display:flex; align-items:center; justify-content:center; }
/* Wrong mode */
.wrong-mode-badge {
  display:none; background:#e74c3c; color:#fff; padding:3px 10px; border-radius:12px;
  font-size:12px; font-weight:600; margin-left:8px; animation:pulse 1.5s infinite;
}
.wrong-mode-badge.active { display:inline-block; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); }
.empty-state .empty-icon { font-size:48px; margin-bottom:12px; }
.empty-state p { font-size:15px; }
.btn-danger { background:#e74c3c; color:#fff; }
.btn-danger:hover { background:#c0392b; }
.stat-card.wrong-stat .stat-num { color:var(--wrong); }
/* Footer */
.footer { text-align:center; padding:24px; color:var(--text-secondary); font-size:12px; }
/* Responsive */
@media (max-width:600px) {
  .container { padding:12px; }
  .question-card { padding:18px 16px 14px; }
  .q-stem { font-size:15px; }
  .header h1 { font-size:15px; }
  .stats-bar { gap:6px; }
  .stat-card { padding:10px 8px; }
  .stat-num { font-size:18px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>🩺 预防医学 · 选择题刷题题库</h1>
  <div class="header-right">
    <span style="font-size:13px;opacity:0.8" id="headerInfo"></span>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
      <span id="themeIcon">🌙</span> <span id="themeLabel">夜间模式</span>
    </button>
  </div>
</div>

<div class="container">
  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">500</div><div class="stat-label">总题数</div></div>
    <div class="stat-card"><div class="stat-num" id="statDone">0</div><div class="stat-label">已做</div></div>
    <div class="stat-card"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">正确</div></div>
    <div class="stat-card wrong-stat"><div class="stat-num" id="statWrong">0</div><div class="stat-label">错题</div></div>
    <div class="stat-card"><div class="stat-num" id="statRate">-</div><div class="stat-label">正确率</div></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <select class="chapter-select" id="chapterSelect" onchange="onChapterChange()">
      <option value="all">📚 全部章节</option>
    </select>
    <div class="mode-btns">
      <button class="mode-btn active" id="btnSequential" onclick="setMode('sequential')">📋 顺序</button>
      <button class="mode-btn" id="btnRandom" onclick="setMode('random')">🎲 随机</button>
    </div>
    <button class="mode-btn" id="btnWrongMode" onclick="toggleWrongMode()">📝 错题集<span class="wrong-mode-badge" id="wrongBadge">ON</span></button>
    <button class="btn btn-outline" onclick="clearWrongAnswers()" style="font-size:12px;">🗑 清错题</button>
    <button class="btn btn-outline" onclick="resetProgress()">🔄 重置</button>
  </div>

  <!-- Progress bar -->
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <!-- Question card -->
  <div class="question-card" id="questionCard">
    <div class="q-header">
      <div class="q-num" id="qNum">Q1</div>
      <div>
        <div class="q-meta">
          <span class="q-tag" id="qChapter"></span>
          <span class="q-tag" id="qSection"></span>
        </div>
      </div>
    </div>
    <div class="q-stem" id="qStem"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="answer-reveal" id="answerReveal">
      <div class="ans-label" id="ansLabel"></div>
      <div class="ans-detail" id="ansDetail"></div>
    </div>
    <div class="nav-row">
      <span style="font-size:13px;color:var(--text-secondary)" id="qCounter"></span>
      <div class="nav-btns">
        <button class="btn btn-outline" onclick="prevQuestion()">◀ 上一题</button>
        <button class="btn" onclick="showAnswer()" id="btnShowAnswer">查看答案</button>
        <button class="btn btn-outline" onclick="nextQuestion()">下一题 ▶</button>
      </div>
    </div>
  </div>

  <!-- Question grid -->
  <div style="margin-top:8px;">
    <button class="btn btn-outline" onclick="toggleGrid()" style="font-size:12px;padding:6px 14px;">
      📐 题目导航网格
    </button>
  </div>
  <div class="q-grid" id="qGrid" style="display:none;"></div>
</div>

<div class="footer">数据来源：预防医学学习指导与习题集 · 共500道选择题</div>

","text":"设立对照组"},{"label":"B","text":"不设立对照"},{"label":"C","text":"是否人为控制研究的条件"},{"label":"D","text":"盲法"},{"label":"E","text":"统计学检验"}],"answer":"C"},{"id":36,"chapter":"第二章 流行病学概论","section":"A1","num":10,"stem":"在流行病学研究中，使用较多的一类方法是","options":[{"label":"A","text":"观察法"},{"label":"B","text":"临床试验法"},{"label":"C","text":"病例询问法"},{"label":"D","text":"流行病数学模型"},{"label":"E","text":"干预实验法"}],"answer":"A"},{"id":37,"chapter":"第二章 流行病学概论","section":"A2","num":11,"stem":"一位研究者选择了100名患新生儿黄疸的患儿，并在同一医院选择了100名未患此病的婴儿，然后查阅了婴儿母亲的妇科和分娩记录，以确定产前和分娩中的各种暴露因素，该研究属何种类型的研究","options":[{"label":"A","text":"现患研究"},{"label":"B","text":"前瞻性队列研究"},{"label":"C","text":"病例报告"},{"label":"D","text":"病例对照研究"},{"label":"E","text":"生态学研究"}],"answer":"D"},{"id":38,"chapter":"第二章 流行病学概论","section":"A2","num":12,"stem":"为了研究高盐饮食与高血压的关系，前后采取了两种研究方法，一种是将人群分为高盐饮食组与低盐饮食组，然后随访两组高血压发病率；另一种是将高血压患者随机分组，一组采取限盐干预，而另一组不干预，然后盲法观察两组的血压控制的差异。这两种流行病学研究方法的根本区别是","options":[{"label":"A","text":"是否设立对照组"},{"label":"B","text":"是否进行显著性检验"},{"label":"C","text":"是否在现场人群中进行"},{"label":"D","text":"是否人为控制研究条件"},{"label":"E","text":"是否检验病因假设"}],"answer":"D"},{"id":39,"chapter":"第二章 流行病学概论","section":"A2","num":13,"stem":"2016年6月，某市一小学出现聚集性甲肝疫情，经调查发现，患者主要以寄宿学生为主，发病集中在6月中下旬。这种调查研究属于","options":[{"label":"A","text":"研究疾病自然史"},{"label":"B","text":"探讨发病机制"},{"label":"C","text":"描述疾病的分布"},{"label":"D","text":"疾病筛检"},{"label":"E","text":"探讨疾病的预防控制效果"}],"answer":"C"},{"id":40,"chapter":"第二章 流行病学概论","section":"A2","num":14,"stem":"为研究某食物与食管癌的关系，根据样本估计，某学者随机选择了一组吃某食物者，又随机选择了一组不吃某食物者作为对照，随访观察10年比较两组食管癌的发病率。在这项流行病学研究中，下列不是研究者所必须遵守的基本原则的是","options":[{"label":"A","text":"群体原则"},{"label":"B","text":"现场原则"},{"label":"C","text":"对比原则"},{"label":"D","text":"代表性原则"},{"label":"E","text":"标准化原则"}],"answer":"E"},{"id":41,"chapter":"第二章 流行病学概论","section":"A2","num":15,"stem":"研究吸烟与肺癌的关系，依据现在是否吸烟，将某目标人群分为吸烟组和非吸烟组，然后对两组研究对象进行一定时间的追踪，观察两组研究对象的肺癌发病和死亡情况，这种研究属于","options":[{"label":"A","text":"队列研究"},{"label":"B","text":"病例对照研究"},{"label":"C","text": 未患欲研究疾病的某人群中选择有、无某暴露因素的两个组"},{"label":"D","text":"患有某种疾病的人群随机分成的两组"},{"label":"E","text":"一组患有某种疾病者，一组为未患有该种疾病者"}],"answer":"C"},{"id":108,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":16,"stem":"不属于队列研究中对照形式的为","options":[{"label":"A","text":"内对照"},{"label":"B","text":"总人口对照"},{"label":"C","text":"外对照"},{"label":"D","text":"安慰剂对照"},{"label":"E","text":"多重对照"}],"answer":"D"},{"id":109,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":17,"stem":"不能作为队列研究暴露人群的为","options":[{"label":"A","text":"特殊暴露人群"},{"label":"B","text":"一般人群中的暴露于某因素者"},{"label":"C","text":"学生中的暴露者"},{"label":"D","text":"不会出现研究结局的暴露者"},{"label":"E","text":"有组织的人群团体中的暴露者"}],"answer":"D"},{"id":110,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":18,"stem":"队列研究中，以人时为单位计算的率为","options":[{"label":"A","text":"患病率"},{"label":"B","text":"发病密度"},{"label":"C","text":"病死率"},{"label":"D","text":"死亡率"},{"label":"E","text":"累积发病率"}],"answer":"B"},{"id":111,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":19,"stem":"在队列研究中，暴露组的疾病发病率与对照组的疾病发病率的差值称为","options":[{"label":"A","text":"AR"},{"label":"B","text":"RR"},{"label":"C","text":"OR"},{"label":"D","text":"PAR"},{"label":"E","text":"AR%"}],"answer":"A"},{"id":112,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":20,"stem":"队列研究属于","options":[{"label":"A","text":"生态学研究"},{"label":"B","text":"分析性研究"},{"label":"C","text":"描述性研究"},{"label":"D","text":"理论性研究"},{"label":"E","text":"实验性研究"}],"answer":"B"},{"id":113,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":21,"stem":"下列关于累积发病率的说法中正确的为","options":[{"label":"A","text":"累积发病率的分子为观察期间的年平均发病人数"},{"label":"B","text":"累积发病率就是人时率"},{"label":"C","text":"累积发病率为暴露组与对照组的发病率之差"},{"label":"D","text":"累积发病率的分母为人时数"},{"label":"E","text":"累积发病率适用于固定队列"}],"answer":"E"},{"id":114,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":22,"stem":"对于队列研究，下列指标中，估计某因素与某疾病关联强度的为","options":[{"label":"A","text":"总人群中该病的发病率"},{"label":"B","text":"暴露人群中该病的发病率"},{"label":"C","text":"人群中该因素的暴露率"},{"label":"D","text":"比值比"},{"label":"E","text":"相对危险度"}],"answer":"E"},{"id":115,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":23,"stem":"在队列研究中，研究对象的分组原则是按","options":[{"label":"A","text":"是否暴露于某因素分组"},{"label":"B","text":"随机分组"},{"label":"C","text":"是否患病分组"},{"label":"D","text":"人为随意分组"},{"label":"E","text":"病情轻重分组"}],"answer":"A"},{"id":116,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":24,"stem":"属于队列研究优点的为","options":[{"label":"A","text":"可计算暴露组和非暴露组的发病率，能直接估计因素与发病的关联强度"},{"label":"B","text":"从果到因的研究"},{"label":"C","text":"需要的样本量比病例对照研究少"},{"label":"D","text":"论证因果关系说服力强于实验流行病学"},{"label":"E","text":"一次调查可研究一种疾病与多种因素的关系"}],"answer":"A"},{"id":117,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":25,"stem":"相对于病例对照研究，不属于队列研究缺点的为","options":[{"label":"A","text":"观察时间长，易发生失访偏倚"},{"label":"B","text":"设计的要求高，实施复杂"},{"label":"C","text":"耗费的时间、物力和人力较多"},{"label":"D","text":"适宜于研究发病率低的疾病"},{"label":"E","text":"暴露与疾病的时间关系不易判断"}],"answer":"E"},{"id":118,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":26,"stem":"历史性队列研究的特点为","options":[{"label":"A","text":"研究开始时结局还未出现"},{"label":"B","text":"分组是根据现在的暴露状况进行的"},{"label":"C","text":"其性质是回顾性的，是从果到因的研究"},{"label":"D","text":"需要完整的关于暴露与结局的历史记录"},{"label":"E","text":"相对于前瞻性队列研究耗费时间长，花费大"}],"answer":"D"},{"id":119,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":27,"stem":"关于结局的说法，正确的为","options":[{"label":"A","text":"结局是观察终止时间"},{"label":"B","text":"结局是观察人群中出现的预期结果事件"},{"label":"C","text":"结局不是队列研究的观察终点"},{"label":"D","text":"研究对象出现了预期的结局，之后还需要对其进行随访"},{"label":"E","text":"研究对象死于非研究疾病时，可视为达到了结局"}],"answer":"B"},{"id":120,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":28,"stem":"关于 SMR 的说法，正确的为","options":[{"label":"A","text":"是标化死亡比"},{"label":"B","text":"表示理论死亡数是实际死亡数的多少倍"},{"label":"C","text":"适合于结局发生率高、暴露组人数多的情况"},{"label":"D","text":"是暴露组与非暴露组死亡率的比值"},{"label":"E","text":"是暴露组与非暴露组死亡率的差值"}],"answer":"A"},{"id":121,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":29,"stem":"由因到果的研究为","options":[{"label":"A","text":"病例对照研究"},{"label":"B","text":"队列研究"},{"label":"C","text":"筛检"},{"label":"D","text":"生态学研究"},{"label":"E","text":"现况研究"}],"answer":"B"},{"id":122,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":30,"stem":"下列叙述中，不属于病例对照研究优点的是","options":[{"label":"A","text":"资料收集后可在短时间内得到结果"},{"label":"B","text":"特别适用于罕见病的研究"},{"label":"C","text":"一次调查可同时研究一种疾病与多个因素的关系"},{"label":"D","text":"可直接获得发病率资料"},{"label":"E","text":"所需研究对象的数量相对于队列研究的较少"}],"answer":"D"},{"id":123,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":31,"stem":"病例对照研究中的调查对象是","options":[{"label":"A","text":"病例组是怀疑患有欲研究疾病的患者，对照组是未患该病的人"},{"label":"B","text":"病例组是具有某种暴露的人，对照组是非暴露于该因素的人"},{"label":"C","text":"病例组是确诊患有欲研究疾病的患者，对照组是确诊未患该病的人"},{"label":"D","text":"病例组和对照组均是具有某种暴露的人"},{"label":"E","text":"病例组是确诊患有欲研究疾病的患者，对照组是怀疑患有该病的人"}],"answer":"C"},{"id":124,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":32,"stem":"下列关于匹配的说法，不正确的为","options":[{"label":"A","text":"匹配可分为频数匹配与个体匹配"},{"label":"B","text":"匹配后，可以对匹配因素与疾病关系进行分析"},{"label":"C","text":"匹配的目的之一是控制混杂因素"},{"label":"D","text":"匹配可以提高研究效率"},{"label":"E","text":"把不必要的变量进行匹配会造成匹配过度"}],"answer":"B"},{"id":125,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":33,"stem":"在病例对照研究中，若病例组某危险因素暴露者的比例在统计学上明显高于对照组，则","options":[{"label":"A","text":"该因素与疾病有统计学关联"},{"label":"B","text":"该因素与疾病有因果关联"},{"label":"C","text":"该因素是疾病的病因"},{"label":"D","text":"该因素与疾病无关联"},{"label":"E","text":"该病由该因素引起"}],"answer":"A"},{"id":126,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":34,"stem":"下列关于病例对照研究特点的说法中，正确的为","options":[{"label":"A","text":"暴露与疾病都是现在的情况"},{"label":"B","text":"能够确证因素与疾病的因果关联"},{"label":"C","text":"由因及果的研究"},{"label":"D","text":"需要随机分组"},{"label":"E","text":"属于观察法"}],"answer":"E"},{"id":127,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":35,"stem":"OR 主要应用于","options":[{"label":"A","text":"临床试验"},{"label":"B","text":"生态学研究"},{"label":"C","text":"现场试验"},{"label":"D","text":"病例对照研究"},{"label":"E","text":"队列研究"}],"answer":"D"},{"id":128,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":36,"stem":"属于病例对照研究缺点的是","options":[{"label":"A","text":"不能分析一种疾病与多种因素的关联"},{"label":"B","text":"容易出现失访偏倚"},{"label":"C","text":"相对于队列研究，样本含量要求很大"},{"label":"D","text":"相对于试验研究，不容易产生医德问题"},{"label":"E","text":"回忆信息时，易出现信息偏倚"}],"answer":"E"},{"id":129,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":37,"stem":"在病例对照研究中，代表性最好的病例来源是","options":[{"label":"A","text":"来自医院的新发病例"},{"label":"B","text":"来自社区的新发病例"},{"label":"C","text":"来自社区的现患病例"},{"label":"D","text":"来自医院的现患病例"},{"label":"E","text":"来自社区的死亡病例"}],"answer":"B"},{"id":130,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":38,"stem":"下列说法中，不属于病例对照研究用途的是","options":[{"label":"A","text":"探索病因"},{"label":"B","text":"初步检验病因假设"},{"label":"C","text":"建立病因假设"},{"label":"D","text":"为进一步研究提供线索"},{"label":"E","text":"确证病因假设"}],"answer":"E"},{"id":131,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":39,"stem":"病例对照研究中，OR 值的含义为","options":[{"label":"A","text":"对照组的发病率与病例组的发病率之差"},{"label":"B","text":"病例组的发病率与对照组的发病率之比"},{"label":"C","text":"病例组的暴露比值与对照组的暴露比值之比"},{"label":"D","text":"病例组的暴露比值与对照组的暴露比值之差"},{"label":"E","text":"对照组的暴露比值与病例组的暴露比值之比"}],"answer":"C"},{"id":132,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":40,"stem":"在医院中进行病例对照研究的缺点是","options":[{"label":"A","text":"不容易收集资料"},{"label":"B","text":"较难获得病例"},{"label":"C","text":"费时、费力"},{"label":"D","text":"易发生选择偏倚"},{"label":"E","text":"代表性好"}],"answer":"D"},{"id":133,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":41,"stem":"在病例对照研究选取对照时，不正确的叙述为","options":[{"label":"A","text":"对照应是产生病例的人群中全体未患该病的一个随机样本"},{"label":"B","text":"对照应包括患有与所研究因素有关的其他疾病"},{"label":"C","text":"对照与病例应除研究因素外具有最大程度的可比性"},{"label":"D","text":"对照可同时选择两种以上对照"},{"label":"E","text":"对照应经过与病例相同的诊断技术确认的非患者"}],"answer":"B"},{"id":134,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":42,"stem":"在病例对照研究中，OR 值与 RR 值较接近的条件为","options":[{"label":"A","text":"疾病发病率小于 10%"},{"label":"B","text":"因素暴露率小于 10%"},{"label":"C","text":"因素暴露率小于 5%"},{"label":"D","text":"疾病发病率小于 5%"},{"label":"E","text":"疾 病 患 病 率 小 于 10%"}],"answer":"D"},{"id":135,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":43,"stem":"在一项研究中，调查50名子宫内膜癌患者和50名无子宫内膜癌的其他疾病患者患病前的雌激素暴露情况，这种研究方法为","options":[{"label":"A","text":"生态学研究"},{"label":"B","text":"现况研究"},{"label":"C","text":"病例对照研究"},{"label":"D","text":"队列研究"},{"label":"E","text":"临床试验"}],"answer":"C"},{"id":136,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":44,"stem":"下列流行病学研究方法中，证明病因假设最可靠的为","options":[{"label":"A","text":"病例对照研究"},{"label":"B","text":"实验流行病学"},{"label":"C","text":"动物实验"},{"label":"D","text":"队列研究"},{"label":"E","text":"现况研究"}],"answer":"B"},{"id":137,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":45,"stem":"属于实验流行病学特征的是","options":[{"label":"A","text":"由果及因，回顾性研究"},{"label":"B","text":"属于观察法"},{"label":"C","text":"按有无疾病分组"},{"label":"D","text":"不能确证因果关联"},{"label":"E","text":"人为施加干预措施"}],"answer":"E"},{"id":138,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":46,"stem":"临床试验中的双盲法是指","options":[{"label":"A","text":"观察者不知试验组和对照组各服用何种药物"},{"label":"B","text":"两组研究对象互不熟悉"},{"label":"C","text":"观察者与被观察者均不知受试者的分组情况和接受的治疗措施"},{"label":"D","text":"观察者与被观察者均不知道安慰剂的化学成分"},{"label":"E","text":"观察者与被观察者均不知道研究药物的化学成分"}],"answer":"C"},{"id":139,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":47,"stem":"临床试验中常用的率为","options":[{"label":"A","text":"患病率"},{"label":"B","text":"发病密度"},{"label":"C","text":"罹患率"},{"label":"D","text":"有效率"},{"label":"E","text":"发病率"}],"answer":"D"},{"id":140,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":48,"stem":"不属于现场试验与前瞻性队列研究共同特点的为","options":[{"label":"A","text":"两者都设有比较组"},{"label":"B","text":"两者都不需要人为施加措施"},{"label":"C","text":"两者都需要随访观察"},{"label":"D","text":"两者都可以对比较组样本率差异进行检验"},{"label":"E","text":"两者都需要注意避免失访"}],"answer":"B"},{"id":141,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":49,"stem":"临床试验中的研究对象需要满足","options":[{"label":"A","text":"男女人数必须相同"},{"label":"B","text":"非暴露者"},{"label":"C","text":"非患病的人群"},{"label":"D","text":"患者中有代表性的样本"},{"label":"E","text":"严重型患者"}],"answer":"D"},{"id":142,"chapter":"第四章 常用流行病学研究方法","section":"A1","num":50,"stem":"关于临床试验中的对照组，正确的说法为"," .000"},{"label":"E","text":"无法计算"}],"answer":"D"},{"id":156,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":64,"stem":"某学者对某公司进行了有关吸烟与肺癌的关系研究，研究者选择了非吸烟者1300名，少量吸烟者1200名，中等吸烟者1800名，大量吸烟者400名，随访观察3年，然后进行各组比较，这种研究方法为","options":[{"label":"A","text":"现况调查"},{"label":"B","text":"队列研究"},{"label":"C","text":"病例对照研究"},{"label":"D","text":"实验研究"},{"label":"E","text":"生态学研究"}],"answer":"B"},{"id":157,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":65,"stem":"在某镇某学者开展了一项持续多年的啤酒狂欢节饮酒者与心血管疾病死亡关系的研究。研究初，有70名啤酒狂欢节饮酒者和1500名非饮酒者。在研究结束时，7名啤酒狂欢节饮酒者死于心血管疾病，45名非啤酒狂欢节饮酒者死于心血管疾病。该研究为","options":[{"label":"A","text":"横断面研究"},{"label":"B","text":"生态学研究"},{"label":"C","text":"队列研究"},{"label":"D","text":"病例对照研究"},{"label":"E","text":"临床试验"}],"answer":"C"},{"id":158,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":66,"stem":"某学者在2010年对某石棉工厂进行石棉与职工死亡关系的研究，该学者收集了该厂1970年的男性工人信息，并收集了这些工人从2000—2005年的死亡信息，他比较了该厂男性石棉工人死亡人数与全国按年龄别调整的死亡人数，并获得了相应结论。下列对该研究不正确的说法为","options":[{"label":"A","text":"该研究对长潜伏期的疾病非常适合"},{"label":"B","text":"该研究节省时间和花费"},{"label":"C","text":"该研究可以获得 SMR"},{"label":"D","text":"时间关系清楚"},{"label":"E","text":"因需要等待几十年才能获得结果，时间长，花费也大"}],"answer":"E"},{"id":159,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":67,"stem":"在 一 项 开 始 于 1980 年 的 研 究 中 ， 某 学 者 调 查 了 某 地 5000 人 饮 酒 史 ，然后 又 对","options":[{"label":"A","text":"横断面研究"},{"label":"B","text":"前瞻性队列研究"},{"label":"C","text":"历史性队列研究"},{"label":"D","text":"临床试验"},{"label":"E","text":"病例对照研究"}],"answer":"B"},{"id":160,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":68,"stem":"某学者对饮酒与糖尿病关系进行了一项队列研究，得到饮酒与糖尿病疾病无关联，下列说法中最可能正确的为","options":[{"label":"A","text":"RR=1 且 AR>1"},{"label":"B","text":"RR=1 且 AR=0"},{"label":"C","text":"RR=0 且 AR=1"},{"label":"D","text":"RR=1 且 AR=1"},{"label":"E","text":"RR=0 且 AR=0"}],"answer":"B"},{"id":161,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":69,"stem":"一项病例对照研究的结果为 OR(95%CI)=11.5(0.8～32.2), 该结果表明","options":[{"label":"A","text":"该暴露因素可能是疾病的危险因素"},{"label":"B","text":"该暴露因素可能是疾病的无关因素"},{"label":"C","t 试验"},{"label":"E","text":"队列研究"}],"answer":"D"},{"id":168,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":76,"stem":"100名2型糖尿病患者接受某种药物治疗，一个月后有85名患者血糖降至正常且无不良反应，下列正确的说法为","options":[{"label":"A","text":"该药物降糖效果好"},{"label":"B","text":"该药物无降糖效果"},{"label":"C","text":"样本量小尚不能作结论"},{"label":"D","text":"时间短疗效可疑"},{"label":"E","text":"未设对照组，无法作结论"}],"answer":"E"},{"id":169,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":77,"stem":"某学者对200名肿瘤患者采用手术加放疗，其疗效与3年前只采用手术治疗的同类肿瘤患者效果进行比较，该研究对照设计类型为","options":[{"label":"A","text":"随机对照"},{"label":"B","text":"自身对照"},{"label":"C","text":"交叉对照"},{"label":"D","text":"历史对照"},{"label":"E","text":"空白对照"}],"answer":"D"},{"id":170,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":78,"stem":"为比较A、B药物预防泌尿系感染的疗效，研究者选择了180名泌尿系感染者，随机分成服用A药组和B药组，盲法观察，结果A药效果优于B药，该研究为","options":[{"label":"A","text":"个体试验"},{"label":"B","text":"队列研究"},{"label":"C","text":"社区试验"},{"label":"D","text":"临床试验"},{"label":"E","text":"病例对照研究"}],"answer":"D"},{"id":171,"chapter":"第四章 常用流行病学研究方法","section":"A2","num":79,"stem":"一项关于女性绝经后服用维生素D预防癌症的研究中，20万名绝经后女性随机分成服用维生素D组和安慰剂组，结果服用维生素D组癌症发生率为5‰,服用安慰剂组癌症发生率为7‰,两组具有统计学显著性差异，下列说法正确的为","options":[{"label":"A","text":"维生素 D 具有预防癌症发生的效果"},{"label":"B","text":"维生素 D 不具有预防癌症发生的效果"},{"label":"C","text":"维生素 D 的效果比安慰剂的效果差"},{"label":"D","text":"维生素 D 具有导致癌症发生的作用"},{"label":"E","text":"未进行自身前后对照，不能下结论"}],"answer":"A"},{"id":172,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":1,"stem":"属于信息偏倚的是","options":[{"label":"A","text":"失访偏倚"},{"label":"B","text":"入院率偏倚"},{"label":"C","text":"检出症候偏倚"},{"label":"D","text":"暴露怀疑偏倚"},{"label":"E","text":"奈曼偏倚"}],"answer":"D"},{"id":173,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":2,"stem":"研究吸烟与肺癌的关系时，为了避免性别因素的影响，只选择成年男性作为研究对象。这种控制混杂偏倚的方法是","options":[{"label":"A","text":"匹配"},{"label":"B","text":"限制"},{"label":"C","text":"随机分配"},{"label":"D","text":"随机抽样"},{"label":"E","text":"明确纳入标准"}],"answer":"B"},{"id":174,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":3,"stem":"在病例对照研究中，由于研究者事先知道研究对象的分组情况，而对病例组的询问仔细认真，对对照组的询问则不太认真。研究者认为对照组不需要像病例组那样花费精力认真调查，由此产生的偏倚是","options":[{"label":"A","text":"诊断怀疑偏倚"},{"label":"B","text":"暴露怀疑偏倚"},{"label":"C","text":"易感性偏倚"},{"label":"D","text":"伯克森偏倚"},{"label":"E","text":"测量偏倚"}],"answer":"B"},{"id":175,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":4,"stem":"伤寒杆菌是导致伤寒病发生的","options":[{"label":"A","text":"直接病因"},{"label":"B","text":"潜在病因"},{"label":"C","text":"重要病因"},{"label":"D","text":"必要病因"},{"label":"E","text":"充分病因"}],"answer":"D"},{"id":176,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":5,"stem":"确定两个变量之间的联系是否为因果联系的必要条件是","options":[{"label":"A","text":"联系的强度"},{"label":"B","text":"彼此独立研究提供的结果具有可重复性"},{"label":"C","text":"原因变量先于结果变量"},{"label":"D","text":"两者之间的联系与目前所掌握的知识具有一致性"},{"label":"E","text":"循证医学的方法"}],"answer":"C"},{"id":177,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":6,"stem":"因素 X 和某疾病都与因素 Y 有联系，由此导致 X 与某疾病之间出现的统计学上的关联","options":[{"label":"A","text":"偶然关联"},{"label":"B","text":"继发关联"},{"label":"C","text":"虚假关联"},{"label":"D","text":"直接关联"},{"label":"E","text":"因果关联"}],"answer":"B"},{"id":178,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":7,"stem":"现代流行病学更为认同且完整的因果作用方式是","options":[{"label":"A","text":"单因单果"},{"label":"B","text":"单因多果"},{"label":"C","text":"多因单果"},{"label":"D","text":"多因多果"},{"label":"E","text":"直接(间接)病因链"}],"answer":"D"},{"id":179,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":8,"stem":"关于偏倚，下列描述正确的是","options":[{"label":"A","text":"偏倚是流行病学研究中随机误差的问题"},{"label":"B","text":"偏倚是流行病学研究的精确性问题"},{"label":"C","text":"偏倚可以通过扩大样本量加以控制"},{"label":"D","text":"偏倚是流行病学研究的真实性问题"},{"label":"E","text":"流行病学研究的真实性问题就是研究中是否存在随机误差的问题"}],"answer":"D"},{"id":180,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":9,"stem":"关于病因，下列描述正确的是","options":[{"label":"A","text":"必要病因是指必然导致疾病发生的最低限度的一组因素"},{"label":"B","text":"那些能使人们发病概率增加的因素，就是病因"},{"label":"C","text":"充分病因是指每一种疾病必由某一特异的因素所引起的"},{"label":"D","text":"现代医学认为疾病是由微生物所引起的"},{"label":"E","text":"疾病是多由来自环境方面的因素综合作用所致"}],"answer":"B"},{"id":181,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":10,"stem":"关于因果关系的判别标准，正确的是","options":[{"label":"A","text":"关联的时间性，即因果的时间顺序是绝对的"},{"label":"B","text":"关联的强度是绝对的"},{"label":"C","text":"不存在关联的合理性时，不存在因果关系"},{"label":"D","text":"关联不具重复性时，不存在因果关系"},{"label":"E","text":"必须符合判断病因的所有标准才能确定因果关系"}],"answer":"A"},{"id":182,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":11,"stem":"判断某因素是否为混杂因素时，下列描述正确的是","options":[{"label":"A","text":"该因素只与所研究疾病的发生有关"},{"label":"B","text":"该因素只与所研究的因素有关"},{"label":"C","text":"该因素不是研究因素与疾病病因链上的中间变量"},{"label":"D","text":"该因素是所研究疾病的必要病因"},{"label":"E","text":"该因素不是所研究疾病的危险因素"}],"answer":"C"},{"id":183,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":12,"stem":"属于数据分析阶段控制混杂因素的方法是","options":[{"label":"A","text":"对研究对象的选择条件加以限制"},{"label":"B","text":"采用配比的方法选择对照"},{"label":"C","text":"采用分层分析方法"},{"label":"D","text":"采用随机化方法进行分组"},{"label":"E","text":"采用分层抽样方法选择研究对象"}],"answer":"C"},{"id":184,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":13,"stem":"以下偏倚只可能出现在队列研究中而不会出现在病例对照研究中的是","options":[{"label":"A","text":"混杂偏倚"},{"label":"B","text":"暴露怀疑偏倚"},{"label":"C","text":"发表偏倚"},{"label":"D","text":"失访偏倚"},{"label":"E","text":"回忆偏倚"}],"answer":"D"},{"id":185,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":14,"stem":"对病例对照研究资料进行分层分析的目的是","options":[{"label":"A","text":"控制混杂偏倚"},{"label":"B","text":"控制选择偏倚"},{"label":"C","text":"控制信息偏倚"},{"label":"D","text":"提高分析效率"},{"label":"E","text":"提高资料的利用率"}],"answer":"A"},{"id":186,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":15,"stem":"研究者进行临床试验时，采用双盲法，可以避免","options":[{"label":"A","text":"选择偏倚"},{"label":"B","text":"信息偏倚"},{"label":"C","text":"混杂偏倚"},{"label":"D","text":"入院率偏倚"},{"label":"E","text":"回忆偏倚"}],"answer":"B"},{"id":187,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":16,"stem":"静脉注射、吸毒是艾滋病病毒感染的","options":[{"label":"A","text":"直接病因"},{"label":"B","text":"必要病因"},{"label":"C","text":"间接病因"},{"label":"D","text":"充分病因"},{"label":"E","text":"组分病因"}],"answer":"C"},{"id":188,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":17,"stem":"在病因推断过程中，反映某个因素与疾病的关联强度常用的指标是","options":[{"label":"A","text":"特异危险度"},{"label":"B","text":"相对危险度"},{"label":"C","text":"归因危险度"},{"label":"D","text":"人群归因危险度"},{"label":"E","text":"归因危险度百分比"}],"answer":"B"},{"id":189,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":18,"stem":"队列研究中，最容易出现的偏倚是","options":[{"label":"A","text":"混杂偏倚"},{"label":"B","text":"失访偏倚"},{"label":"C","text":"差异错分偏倚"},{"label":"D","text":"选择偏倚"},{"label":"E","text":"入院率偏倚"}],"answer":"B"},{"id":190,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":19,"stem":"流行病学研究方法中，确定因果关联的论证强度上，排列正确的是","options":[{"label":"A","text":"病例对照研究>生态学时间序列研究>队列研究"},{"label":"B","text":"实验性研究>病例对照研究 >横断面研究"},{"label":"C","text":"病例对照研究>队列研究>生态学时间序列研究"},{"label":"D","text":"生态学时间序列研究>实验性研究>病例对照研究"},{"label":"E","text":"队列研究>病例对照研究 >实验性研究"}],"answer":"B"},{"id":191,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":20,"stem":"病例对照研究中最易出现的偏倚是","options":[{"label":"A","text":"回忆偏倚"},{"label":"B","text":"志愿者偏倚"},{"label":"C","text":"混杂偏倚"},{"label":"D","text":"失访偏倚"},{"label":"E","text":"诊断怀疑偏倚"}],"answer":"A"},{"id":192,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":21,"stem":"以下偏倚属于选择偏倚的是","options":[{"label":"A","text":"测量偏倚"},{"label":"B","text":"回忆偏倚"},{"label":"C","text":"混杂偏倚"},{"label":"D","text":"失访偏倚"},{"label":"E","text":"诊断怀疑偏倚"}],"answer":"D"},{"id":193,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":22,"stem":"因果关联是指","options":[{"label":"A","text":"暴露-疾病有时间先后的无偏关联"},{"label":"B","text":"暴露-疾病有较强的统计学关联"},{"label":"C","text":"暴露-疾病有时间先后的直接关联"},{"label":"D","text":"暴露-疾病排除偏倚后的关联"},{"label":"E","text":"暴露-疾病存在相关"}],"answer":"A"},{"id":194,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":23,"stem":"病例对照研究中，减少入院率偏倚的方法是","options":[{"label":"A","text":"在多个医院选择研究对象"},{"label":"B","text":"选择新发病例作为研究对象"},{"label":"C","text":"采用盲法收集资料"},{"label":"D","text":"资料分析采用分层分析"},{"label":"E","text":"研究设计阶段进行匹配"}],"answer":"A"},{"id":195,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":24,"stem":"儿童龋齿随饮水氟含量的减少而增加，建立病因假设的最佳推理方法是","options":[{"label":"A","text":"剩余法"},{"label":"B","text":"求同法"},{"label":"C","text":"求异法"},{"label":"D","text":"同异并用法"},{"label":"E","text":"共变法"}],"answer":"E"},{"id":196,"chapter":"第五章 偏倚控制及病因推断","section":"A1","num":25,"stem":"疾病轮状模型的外环是指","options":[{"label":"A","text":"宿主"},{"label":"B","text":"环境"},{"label":"C","text":"遗传因子"},{"label":"D","text":"生物环境"},{"label":"E","text":"社会环境"}],"answer":"B"},{"id":197,"chapter":"第五章 偏倚控制及病因推断","section":"A2","num":26,"stem":"吸烟与肺癌关系的病例对照研究中，已知性别与吸烟有关，不同性别发生肺癌的频率不同。研究中对照组女性占80%,男性占20%,而病例组女性占20%,男性占80%,这可能会造成","options":[{"label":"A","text":"选择偏倚"},{"label":"B","text":"混杂偏倚"},{"label":"C","text":"信息偏倚"},{"label":"D","text":"错分偏倚"},{"label":"E","text":"观察偏倚"}],"answer":"B"},{"id":198,"chapter":"第五章 偏倚控制及病因推断","section":"A2","num":27,"stem":"一项在医院进行的吸烟与肺癌关系的病例对照研究，研究者选择100名确诊为肺癌的患者为病例组，采用配比的方法选择100名高血压患者为对照组，结果表明吸烟导致肺癌发生的OR值为1。吸烟与肺癌没有关系，此结论","options":[{"label":"A","text":"正确"},{"label":"B","text":"不正确，因为可能存在错分偏倚"},{"label":"C","text":"不正确，因为可能存在信息偏倚"},{"label":"D","text":"不正确，因为对照选择不合理"},{"label":"E","text":"不正确，因为没有控制混杂因素"}],"answer":"D"},{"id":199,"chapter":"第五章 偏倚控制及病因推断","section":"A2","num":28,"stem":"胡萝卜素与食管癌关系的病例对照研究中，对病例组和对照组20年前冷冻储存的血清标本进行检测，之后发现两组标本在储存时都已变性，这会导致以下哪种情况","options":[{"label":"A","text":"选择偏倚"},{"label":"B","text":"无差异性错分"},{"label":"C","text":"差异性错分"},{"label":"D","text":"混杂"},{"label":"E","text":"高估"}],"answer":"B"},{"id":200,"chapter":"第五章 偏倚控制及病因推断","section":"A2","num":29,"stem":"妊娠感染与儿童白血病关系的病例对照研究中，白血病患儿的母亲(病例组)会报告更多的假阳性妊娠感染的信息，则此研究最可能的效应是","options":[{"label":"A","text":"高估"},{"label":"B","text":"低估"},{"label":"C","text":"无效应"},{"label":"D","text":"混杂"},{"label":"E","text":"尚不能确定"}],"answer":"A"},{"id":201,"chapter":"第五章 偏倚控制及病因推断","section":"A2","num":30,"stem":"根 据 某 医 院 20 年 来 500 例 肺 癌 住 院 患 者 分 析 ，吸 烟 者 占 80%,不 吸 烟 者 仅 为 20%,","options":[{"label":"A","text":"正确，因为患者中吸烟率高于不吸烟率"},{"label":"B","text":"错误，因为没有计算 P 值"},{"label":"C","text":"错误，因为只是一个医院的资料，代表性不够"},{"label":"D","text":"错误，因为没有对照"},{"label":"E","text":"错误，因为没计算相对危险度"}],"answer":"D"},{"id":202,"chapter":"第六章 筛检与诊断试验","section":"A1","num":1,"stem":"在某社区开展的糖尿病普查中，有80%的糖尿病患者的空腹血糖实验阳性，试问该值反映的是空腹血糖试验的","options":[{"label":"A","text":"灵敏度"},{"label":"B","text":"特异度"},{"label":"C","text":"假阳性率"},{"label":"D","text":"真阴性率"},{"label":"E","text":"一致性"}],"answer":"A"},{"id":203,"chapter":"第六章 筛检与诊断试验","section":"A1","num":2,"stem":"有关筛检的说法，正确的是","options":[{"label":"A","text":"筛检试验的灵敏度是指一项筛检试验能将实际无病的人正确地判断为患者的能力"},{"label":"B","text":"灵敏度与假阳性是互补的，特异度与假阴性是互补的"},{"label":"C","text":"并联试验可以提高特异度，串联试验可以提高灵敏度"},{"label":"D","text":"一般灵敏度高的试验阴性预测值高，特异度高的试验阳性预测值高"},{"label":"E","text":"灵敏度和特异度是互补的"}],"answer":"D"},{"id":204,"chapter":"第六章 筛检与诊断试验","section":"A1","num":3,"stem":"关于诊断试验的评价指标，正确的是","options":[{"label":"A","text":"试验的灵敏度愈高阳性预测值愈高"},{"label":"B","text":"试验的特异度愈高阴性预测值愈高"},{"label":"C","text":"试验阳性预测值上升，试验阴性预测值随之上升"},{"label":"D","text":"现患率增加，试验阳性预测值上升"},{"label":"E","text":"现患率增加，试验阴性预测值上升"}],"answer":"D"},{"id":205,"chapter":"第六章 筛检与诊断试验","section":"A1","num":4,"stem":"所谓筛检是指","options":[{"label":"A","text":"在人群中采用快速的试验或其他方法确诊患者"},{"label":"B","text":"在人群中采用诊断试验确诊患者"},{"label":"C","text":"在人群中运用快速、简便的试验或其他方法，将未诊断或未察觉疾病的人群中那些可疑 有病 或有缺陷的、但表面健康的个体，同可能无病者鉴别开来"},{"label":"D","text":"在人群中随机抽取一部分人进行检查"},{"label":"E","text":"在人群中随机抽取一部分人进行初步体检，阳性者再到医院进行诊断"}],"answer":"C"},{"id":206,"chapter":"第六章 筛检与诊断试验","section":"A1","num":5,"stem":"不是评价试验真实性的指标","options":[{"label":"A","text":"灵敏度"},{"label":"B","text":"特异度"},{"label":"C","text":"约登指数"},{"label":"D","text":"粗一致性"},{"label":"E","text":"阳性预测值"}],"answer":"E"},{"id":207,"chapter":"第六章 筛检与诊断试验","section":"A1","num":6,"stem":"如果某项检验指标高滴度与疾病有联系时，将诊断标准降低一个稀释度则很可能会导致","options":[{"label":"A","text":"灵敏度和特异度都增加"},{"label":"B","text":"特异度减小而灵敏度增加"},{"label":"C","text":"灵敏度减小而特异度增加"},{"label":"D","text":"灵敏度、特异度都减小"},{"label":"E","text":"灵敏度增加，特异度则根据情况增加或减小"}],"answer":"B"},{"id":208,"chapter":"第六章 筛检与诊断试验","section":"A1","num":7,"stem":"直接影响诊断试验阳性预测值的是","options":[{"label":"A","text":"发病率"},{"label":"B","text":"患病率"},{"label":"C","text":"死亡率"},{"label":"D","text":"生存率"},{"label":"E","text":"罹患率"}],"answer":"B"},{"id":209,"chapter":"第六章 筛检与诊断试验","section":"A1","num":8,"stem":"关于诊断方法的叙述，正确的是","options":[{"label":"A","text":"评价某种试验方法的可靠性指标主要包括特异度和灵敏度"},{"label":"B","text":"误诊率又称假阴性率"},{"label":"C","text":"正 确 指 数 =真 实 性 +可 靠 性 - 1"},{"label":"D","text":"灵敏度是指实际有病而按该诊断标准被正确地判为有病的百分比"},{"label":"E","text":"特异度是指实际无病而按该标准被判为有病的百分比"}],"answer":"D"},{"id":210,"chapter":"第六章 筛检与诊断试验","section":"A1","num":9,"stem":"当评价一项诊断试验的真实性时，说法正确的是","options":[{"label":"A","text":"只要灵敏度高其真实性必定高"},{"label":"B","text":"只要特异度高其真实性必定高"},{"label":"C","text":"阳性预测值越高其真实性越高"},{"label":"D","text":"假阳性率与假阴性率均低时真实性高"},{"label":"E","text":"假阳性率与假阴性率均高时真实性高"}],"answer":"D"},{"id":211,"chapter":"第六章 筛检与诊断试验","section":"A1","num":10,"stem":"在血清诊断试验中不同实验室或不同的仪器对同一未知样本做检测，目的是评价","options":[{"label":"A","text":"试验可靠性"},{"label":"B","text":"试验实用性"},{"label":"C","text":"试验真实性"},{"label":"D","text":"试验敏感性"},{"label":"E","text":"试验特异性"}],"answer":"A"},{"id":212,"chapter":"第六章 筛检与诊断试验","section":"A1","num":11,"stem":"描述中适用于筛查的是","options":[{"label":"A","text":"自然史不明确的疾病"},{"label":"B","text":"患病率低的疾病"},{"label":"C","text":"早期诊断可改善预后的疾病"},{"label":"D","text":"病情严重难以治愈的疾病"},{"label":"E","text":"给患者群带来精神压力的疾病"}],"answer":"C"},{"id":213,"chapter":"第六章 筛检与诊断试验","section":"A1","num":12,"stem":"哪种说法不正确的是","options":[{"label":"A","text":"一般可从真实性、可靠性、收益三方面评价诊断试验"},{"label":"B","text":"评价诊断试验可靠性的指标是 Kappa 值"},{"label":"C","text":"评价诊断试验效益的指标是预测值和似然比"},{"label":"D","text":"评价诊断试验可靠性的指标是灵敏度和特异度"},{"label":"E","text":"评价诊断试验真实性的指标是灵敏度和特异度"}],"answer":"D"},{"id":214,"chapter":"第六章 筛检与诊断试验","section":"A1","num":14,"stem":"关于筛检，以下哪些陈述是错误的","options":[{"label":"A","text":"所筛检的疾病有可识别的临床症状和体征"},{"label":"B","text":"筛检计划必须要考虑它的成本和效益问题"},{"label":"C","text":"筛检阳性者，有确实的诊断手段和治疗措施"},{"label":"D","text":"筛检可用来发现人群中可能患病的患者"},{"label":"E","text":"筛检方法能够被群众所接受"}],"answer":"A"},{"id":215,"chapter":"第六章 筛检与诊断试验","section":"A1","num":15,"stem":"哪些疾病适合做大规模的筛检","options":[{"label":"A","text":"原位子宫颈癌"},{"label":"B","text":"全民检查 HBsAg"},{"label":"C","text":"艾滋病"},{"label":"D","text":"流行性感冒"},{"label":"E","text":"麻疹"}],"answer":"A"},{"id":216,"chapter":"第六章 筛检与诊断试验","section":"A1","num":16,"stem":"关于筛检一般不要求具备的特点是","options":[{"label":"A","text":"灵敏度高"},{"label":"B","text":"简便、快速"},{"label":"C","text":"经济"},{"label":"D","text":"准确、权威"},{"label":"E","text":"安全"}],"answer":"D"},{"id":217,"chapter":"第六章 筛检与诊断试验","section":"A1","num":17,"stem":"关于诊断试验的论述正确的是","options":[{"label":"A","text":"灵敏度是指新诊断方法检测出的阴性人数中真正患者所占的比例"},{"label":"B","text":"特异度是指在“金标准”确诊的患者中用新诊断方法检测出的阳性人数所占的比例"},{"label":"C","text":"真实性是指在“金标准”确诊的患者中用新诊断方法检测出的阳性人数所占的比例"},{"label":"D","text":"误诊率是指在新诊断方法检测出的所有阳性人数中，误判为患者的比例"},{"label":"E","text":"漏诊率是指在“金标准”确诊的患者中用新诊断方法误判为阴性的比例"}],"answer":"E"},{"id":218,"chapter":"第六章 筛检与诊断试验","section":"A1","num":19,"stem":"评价某诊断试验诊断某病的价值时，研究对象必须为","options":[{"label":"A","text":"一组被金标准确诊的该病患者和一组被金标准排除该病的健康人"},{"label":"B","text":"一组被金标准确诊的该病患者和一组被金标准排除该病而且未患能影响试验结果的疾病的人"},{"label":"C","text":"一组被金标准确诊的该病患者和一组被金标准排除该病的其他疾病患者"},{"label":"D","text":"一组被金标准确诊的该病患者"},{"label":"E","text":"到医院就诊的患者"}],"answer":"C"},{"id":219,"chapter":"第六章 筛检与诊断试验","section":"A2","num":20,"stem":"假定某一筛选计划检查了1000人，又假定某病的流行率为4%,而这种筛选试验的灵敏度为90%,特异度为80%。根据这些资料判断，被筛选出来的阳性者中真患者数是","options":[{"label":"A","text":"40 人"},{"label":"B","text":"4 人"},{"label":"C","text":"36 人"},{"label":"D","text":"192 人"},{"label":"E","text":"768 人"}],"answer":"C"},{"id":220,"chapter":"第六章 筛检与诊断试验","section":"A2","num":21,"stem":"应用一种筛选乳腺癌的试验，检查经活检证实患有乳腺癌的1000名妇女和未患乳腺癌的1000名妇女，检查结果患乳腺癌组中有900名得出阳性结果，未患乳腺癌组中有100名阳性。该试验的灵敏度是","options":[{"label":"A","text":"90%"},{"label":"B","text":"10%"},{"label":"C","text":"25%"},{"label":"D","text":"30%"},{"label":"E","text":"12%"}],"answer":"A"},{"id":221,"chapter":"第六章 筛检与诊断试验","section":"A2","num":22,"stem":"应用一种筛选乳腺癌的试验，检查经活检证实患有乳腺癌的1000名妇女和未患乳腺癌的1000名妇女，检查结果患乳腺癌组中有900名得出阳性结果，未患乳腺癌组中有100名阳性。该试验的阳性预测值是","options":[{"label":"A","text":"90%"},{"label":"B","text":"10%"},{"label":"C","text":"25%"},{"label":"D","text":"30%"},{"label":"E","text":"12%"}],"answer":"A"},{"id":222,"chapter":"第六章 筛检与诊断试验","section":"A2","num":23,"stem":"在A、B两组人群中进行筛选，假定筛选试验的灵敏度和特异度是已知的，A人群患病率为10%,B人群为1%,哪种结论是正确的","options":[{"label":"A","text":"A 人群阳性结果者中真阳性的比例低于 B 人群"},{"label":"B","text":"A 人群中特异度低于 B 人群"},{"label":"C","text":"A 人群中可靠性高于 B 人群"},{"label":"D","text":"A 人群阳性结果者中假阳性者所占比例低于 B 人群"},{"label":"E","text":"A 人群中灵敏度高于 B 人群"}],"answer":"D"},{"id":223,"chapter":"第六章 筛检与诊断试验","section":"A2","num":24,"stem":"在高血压筛检方案中，A医师将收缩压、舒张压水平定在140/90mmHg,而B医师将收缩压、舒张压定在130/85mmHg,这意味着","options":[{"label":"A","text":"前者的灵敏度比后者高"},{"label":"B","text":"前者的特异度比后者高"},{"label":"C","text":"前者的假阳性率比后者高"},{"label":"D","text":"后者的阳性预测值比前者高"},{"label":"E","text":"后者的假阴性率比前者高"}],"answer":"B"},{"id":224,"chapter":"第六章 筛检与诊断试验","section":"A2","num":25,"stem":"假定某病的患病率为 10‰,用某项灵敏度为 80%,特异度为 90%的筛检试验检查 1000 人 的","options":[{"label":"A","text":"99 人"},{"label":"B","text":"198 人"},{"label":"C","text":"2 人"},{"label":"D","text":"891 人"},{"label":"E","text":"107 人"}],"answer":"A"},{"id":225,"chapter":"第六章 筛检与诊断试验","section":"A2","num":26,"stem":"某社区人口为1万人，现拟用血糖试验(≥130mg/d1)来筛检糖尿病。假设该社区人群糖尿病患病率为10%。,其中有80例糖尿病患者血糖≥130mg/dl,7900例非患者血糖<130mg/dl,则该试验的约登指数为","options":[{"label":"A","text":"不能计算，因为没有患者人数"},{"label":"B","text":"不能计算，因为没有非患者人数"},{"label":"C","text":"能计算，因为具备条件"},{"label":"D","text":"能计算，因为计算约登指数不需患者和非患者人数"},{"label":"E","text":"不能计算，因为不知道试验的灵敏度和特异度"}],"answer":"C"},{"id":226,"chapter":"第七章 公共卫生监测与疾病暴发调查","section":"A1","num":1,"stem":"不属于公共卫生监测目的的是","options":[{"label":"A","text":"发现主要公共卫生问题"},{"label":"B","text":"预警突发公共卫生事件"},{"label":"C","text":"制定公共卫生政策"},{"label":"D","text":"连续、系统地收集资料"},{"label":"E","text":"评价干预措施效果"}],"answer":"D"},{"id":227,"chapter":"第七章 公共卫生监测与疾病暴发调查","section":"A1","num":2,"stem":"有关疾病监测的论述错误的是","options":[{"label":"A","text":"主动监测的数据比被动监测更准确"},{"label":"B","text":"被动 bel":"A","text":"及时性"},{"label":"B","text":"一致性"},{"label":"C","text":"准确性"},{"label":"D","text":"针对性"},{"label":"E","text":"专业性"}],"answer":"C"},{"id":250,"chapter":"第八章 临床预防服务概论","section":"A1","num":20,"stem":"健康风险评估的主要核心是","options":[{"label":"A","text":"制订评估报告"},{"label":"B","text":"解读评估报告"},{"label":"C","text":"设计风险评估问卷"},{"label":"D","text":"对未来患病或死亡危险性的量化评估"},{"label":"E","text":"收集大量的个人疾病信息"}],"answer":"D"},{"id":251,"chapter":"第八章 临床预防服务概论","section":"A1","num":21,"stem":"以下不属于健康危险因素的是","options":[{"label":"A","text":"长期吸烟"},{"label":"B","text":"糖尿病家族史"},{"label":"C","text":"血清胆固醇浓度过高"},{"label":"D","text":"肥胖"},{"label":"E","text":"适度锻炼"}],"answer":"E"},{"id":252,"chapter":"第八章 临床预防服务概论","section":"A2","num":22,"stem":"王某男性30岁，因咳嗽就医。患者吸烟10年，饮酒，经常通宵玩牌。你作为一名接诊该患者的医生，不应该","options":[{"label":"A","text":"针对咳嗽原因进行治疗"},{"label":"B","text":"告知患者吸烟、饮酒的危害，并劝其放弃"},{"label":"C","text":"评估该患者患高血压、冠心病的风险"},{"label":"D","text":"告知患者定期测量血压"},{"label":"E","text":"仅要求患者服药治疗，其他都是多余的"}],"answer":"E"},{"id":253,"chapter":"第八章 临床预防服务概论","section":"A2","num":23,"stem":"某地监测儿童口腔卫生发现儿童乳龋患病率较高，对龋齿的原因进行调查发现该地区饮水中含氟量较低，于是相关部门在居民饮水中加入氟化物，并告知居民使用含氟牙膏。结合以上例子，以下错误的是","options":[{"label":"A","text":"使用含氟牙膏化学预防"},{"label":"B","text":"除了在水中加氟外，还要寻求其他原因降低龋齿的患病率"},{"label":"C","text":"对有龋齿的儿童要定期监测，并教育其注意口腔卫生"},{"label":"D","text":"告知儿童家属要及时治疗龋齿"},{"label":"E","text":"在水中加氟化物属于预防性治疗措施"}],"answer":"E"},{"id":254,"chapter":"第八章 临床预防服务概论","section":"A2","num":24,"stem":"王大爷，70余岁，吸烟喝酒40多年，身体一直很硬朗，血压也很正常。2015年冬天的一个早晨，王大爷起床时发现左侧腿部不能动，入院后诊断为脑梗死。以下叙述不正确的是","options":[{"label":"A","text":"只需要患者服药治疗，其他都是多余的"},{"label":"B","text":"天气太冷可能是引发该病的直接因素"},{"label":"C","text":"医生应劝告患者戒烟戒酒"},{"label":"D","text":"医生应告知患者定期来医院检测"},{"label":"E","text":"该病主要是由于患者不良生活习惯引发"}],"answer":"A"},{"id":255,"chapter":"第八章 临床预防服务概论","section":"A2","num":25,"stem":"一名年轻演员在一次车祸后被送入急诊室。他因为驾车没有系安全带，在高速碰撞后被抛出车外10m,头部受到致命损伤，经检查其酒精浓度高达0.24%。在过去一年内，该演员患过慢性胃炎，从高中起就有明确的饮酒史，经常驾车不系安全带。这则案例给我们的启示不包括","options":[{"label":"A","text":"每个疾病或死亡都可以在生命的早期有效预防"},{"label":"B","text":"每种疾病或危害都是不可预知的"},{"label":"C","text":"只有提高对疾病和危险的认识，才能重视这些看不见的疾病和危害"},{"label":"D","text":"疾病和危害的发生在偶然性中包含着必然性"},{"label":"E","text":"在发生危害的前期，就可以发现危险因素或亚临床症状"}],"answer":"B"},{"id":256,"chapter":"第八章 临床预防服务概论","section":"A2","num":26,"stem":"某医生日常诊疗中，发现该地区儿童缺钙较多，有医药公司向他推销某款新上市的可预防缺钙的药品，你认为以下正确的是","options":[{"label":"A","text":"不推荐患者使用，因为该药虽然有效但价格昂贵"},{"label":"B","text":"不推荐患者使用，因为仅有少数证据表明该药的有效性"},{"label":"C","text":"不推荐患者使用，因为仅有中度肯定性研究表明该药的有效性"},{"label":"D","text":"推荐患者使用，因为高度肯定性研究表明有很大的净效益"},{"label":"E","text":"只要有效就可推荐使用"}],"answer":"D"},{"id":257,"chapter":"第八章 临床预防服务概论","section":"A2","num":27,"stem":"小张，刚从医科院校毕业，去社区卫生服务中心面试找工作。面试人员在问及其专业知识时提到，在临床预防服务中，以下不能用于搜集危险因素的是","options":[{"label":"A","text":"门诊询问"},{"label":"B","text":"体格检查"},{"label":"C","text":"实验室检查"},{"label":"D","text":"病历查阅"},{"label":"E","text":"随访调查"}],"answer":"E"},{"id":258,"chapter":"第八章 临床预防服务概论","section":"A2","num":28,"stem":"张伯伯，57岁，汉族。身高168cm,体重75kg,血压130/70mmHg,爱吃油腻和辛辣食品，抽烟、喝酒、爱打牌，很少参与体育锻炼。父母及兄妹中有冠心病史。如要分析张伯伯患冠心病的风险，首要的一步是","options":[{"label":"A","text":"收集冠心病患病率资料"},{"label":"B","text":"收集个体健康危险因素资料"},{"label":"C","text":"计算危险因素"},{"label":"D","text":"制订个性化的健康干预措施"},{"label":"E","text":"收集冠心病死亡率资料"}],"answer":"B"},{"id":259,"chapter":"第八章 临床预防服务概论","section":"A2","num":29,"stem":"王女士，50岁，极少进行体育锻炼。喜饮酒，每周有5～6次饮酒，饮食不规律，无吸烟史，有糖尿病，父母无慢性病史，曾经罹患甲型病毒性肝炎，对该就医者不应该实施的临床预防服务有","options":[{"label":"A","text":"酗酒筛检和健康咨询"},{"label":"B","text":"进行肝癌筛检"},{"label":"C","text":"补充维生素D"},{"label":"D","text":"健康饮食和体力活动的健康教育"},{"label":"E","text":"乳腺癌筛检"}],"answer":"C"},{"id":260,"chapter":"第十一章 合理营养指导","section":"A1","num":1,"stem":"营养素是指食物中所含的营养成分，下列中在机体通过氧化能够产生能量的营养素是","options":[{"label":"A","text":"维生素"},{"label":"B","text":"蛋白质"},{"label":"C","text":"无机盐"},{"label":"D","text":"膳食纤维"},{"label":"E","text":"微量元素"}],"answer":"B"},{"id":261,"chapter":"第十一章 合理营养指导","section":"A1","num":2,"stem":"下列哪种营养素属于宏量营养素","options":[{"label":"A","text":"维生素 D"},{"label":"B", :"维生素 C"}],"answer":"B"},{"id":277,"chapter":"第十一章 合理营养指导","section":"A1","num":18,"stem":"中国营养学会建议的平衡膳食宝塔提出了","options":[{"label":"A","text":"食物分类的概念"},{"label":"B","text":"每日膳食营养供给量"},{"label":"C","text":"营养上比较理想的膳食模式"},{"label":"D","text":"具体的食谱"},{"label":"E","text":"可以使用的食物种类"}],"answer":"C"},{"id":278,"chapter":"第十一章 合理营养指导","section":"A1","num":19,"stem":"下列富含维生素 C 的食物是","options":[{"label":"A","text":"鸡蛋"},{"label":"B","text":"柑橘"},{"label":"C","text":"奶"},{"label":"D","text":"薯类"},{"label":"E","text":"玉米"}],"answer":"B"},{"id":279,"chapter":"第十一章 合理营养指导","section":"A1","num":20,"stem":"平衡膳食是指","options":[{"label":"A","text":"供给机体足够的能量和各种营养素，并保持他们之间适当的比例"},{"label":"B","text":"供给机体足够的能量和各种营养素"},{"label":"C","text":"供给机体足够的能量"},{"label":"D","text":"供给机体全部营养素"},{"label":"E","text":"供给机体足够营养素"}],"answer":"A"},{"id":280,"chapter":"第十一章 合理营养指导","section":"A1","num":21,"stem":"蔬菜水果中不能提供的维生素是","options":[{"label":"A","text":"叶酸"},{"label":"B","text":"胡萝卜素"},{"label":"C","text":"维生素 C"},{"label":"D","text":"维生素 B₁"},{"label":"E","text":"维生素 D"}],"answer":"E"},{"id":281,"chapter":"第十一章 合理营养指导","section":"A1","num":22,"stem":"根据《中国居民膳食指南(2016)》,结合中国居民实际情况设计的中国居民平衡膳食宝塔以图形的形式体现了比较理想的膳食模式，下列相关叙述中正确的是","options":[{"label":"A","text":"底层的是谷类、薯类及杂豆食物，应摄入 250～500g/d"},{"label":"B","text":"第二层为蔬菜和水果，应摄入 300～500g/d 和 200～400g/d"},{"label":"C","text":"第三层为鱼、禽、肉、蛋等动物性食物，应摄入 125～225g/d"},{"label":"D","text":"第四层是奶类食物，奶类及奶制品应摄入 100g/d"},{"label":"E","text":"塔尖是烹调油和食盐，烹调油不超过 25～30g/d, 食盐不超过 6g/d"}],"answer":"E"},{"id":282,"chapter":"第十一章 合理营养指导","section":"A1","num":23,"stem":"我国营养学会推荐老年人每日膳食钙的适宜摄入量为","options":[{"label":"A","text":"800mg/d"},{"label":"B","text":"1000mg/d"},{"label":"C","text":"1200mg/d"},{"label":"D","text":"1500mg/d"},{"label":"E","text":"2000mg"}],"answer":"B"},{"id":283,"chapter":"第十一章 合理营养指导","section":"A1","num":24,"stem":"与婴儿“神经管畸形”发生相关的维生素是","options":[{"label":"A","text":"维生素 B₁"},{"label":"B","text":"维生素 A"},{"label":"C","text":"叶酸"},{"label":"D","text":" "A","text":"主食应以精米、精面为主"},{"label":"B","text":"主食中包括一定量的粗粮、杂粮"},{"label":"C","text":"多食用动物性食品"},{"label":"D","text":"少吃蔬菜、水果"},{"label":"E","text":"少食用牛奶或食用奶制品"}],"answer":"B"},{"id":292,"chapter":"第十一章 合理营养指导","section":"A1","num":33,"stem":"膳食调查方法中，可以反映长期膳食行为，其结果可作为研究慢性病与膳食模式关系依","options":[{"label":"A","text":"称重法"},{"label":"B","text":"记账法"},{"label":"C","text":"化学分析法"},{"label":"D","text":"回顾调查法"},{"label":"E","text":"食物频率法"}],"answer":"E"},{"id":293,"chapter":"第十一章 合理营养指导","section":"A1","num":34,"stem":"中国成人判断超重和肥胖程度的 BMI 界限值是","options":[{"label":"A","text":"25.0～28.9kg/m² 为超重，≥29 为肥胖"},{"label":"B","text":"24.0～27.9kg/m² 为超重，≥28 为肥胖"},{"label":"C","text":"24.0～29.9kg/m² 为超重，≥30 为肥胖"},{"label":"D","text":"23.0～26.9kg/m²为超重，≥27 为肥胖"},{"label":"E","text":"22.0～ 23.9kg/m² 为超重，≥24 为肥胖"}],"answer":"B"},{"id":294,"chapter":"第十一章 合理营养指导","section":"A1","num":35,"stem":"普通膳食主要适用于","options":[{"label":"A","text":"恶心、呕吐"},{"label":"B","text":"术后患者"},{"label":"C","text":"咀嚼困难的患者"},{"label":"D","text":"发烧患者"},{"label":"E","text":"消化道功能正常、无发热、无腹泻患者"}],"answer":"E"},{"id":295,"chapter":"第十一章 合理营养指导","section":"A1","num":36,"stem":"低蛋白膳食的适用对象是","options":[{"label":"A","text":"肾脏疾病"},{"label":"B","text":"高血压"},{"label":"C","text":"心脏病"},{"label":"D","text":"糖尿病"},{"label":"E","text":"肥胖"}],"answer":"A"},{"id":296,"chapter":"第十一章 合理营养指导","section":"A1","num":37,"stem":"低盐膳食限制每日膳食中的含盐量是","options":[{"label":"A","text":"5～8g"},{"label":"B","text":"2～6g"},{"label":"C","text":"1～4g"},{"label":"D","text":"<6g"},{"label":"E","text":"8～12g"}],"answer":"C"},{"id":297,"chapter":"第十一章 合理营养指导","section":"A1","num":38,"stem":"低嘌呤饮食的适用对象是","options":[{"label":"A","text":"肾脏疾病"},{"label":"B","text":"急性痛风"},{"label":"C","text":"急性传染病患者"},{"label":"D","text":"糖尿病"},{"label":"E","text":"肥胖"}],"answer":"B"},{"id":298,"chapter":"第十一章 合理营养指导","section":"A1","num":39,"stem":"低盐膳食的适用对象是","options":[{"label":"A","text":"心脏病"},{"label":"B","text":"急性痛风"},{"label":"C","text":"急性传染病患者"},{"label":"D","text":"糖尿病"},{"label":"E","text":"高血压"}],"answer":"E"},{"id":299,"chapter":"第十一章 合理营养指导","section":"A1","num":40,"stem":"对肠内营养描述不正确的是","options":[{"label":"A","text":"指经鼻胃(鼻肠)管或经胃肠造瘘管滴入要素制剂"},{"label":"B","text":"只要胃肠功能允许，应尽量采用经胃肠营养"},{"label":"C","text":"较符合生理状态"},{"label":"D","text":"适用于胃肠道功能障碍或衰竭的患者"},{"label":"E","text":"通常配成能量密度为 1kcal/ml 的溶液"}],"answer":"D"},{"id":300,"chapter":"第十一章 合理营养指导","section":"A1","num":41,"stem":"对肠外营养描述不正确的是","options":[{"label":"A","text":"肠外营养的禁忌证包括严重呼吸和循环功能衰竭"},{"label":"B","text":"可通过周围静脉和中心静脉输入"},{"label":"C","text":"适用于胃肠道功能正常的患者"},{"label":"D","text":"适用于胃肠道功能障碍或衰竭的患者"},{"label":"E","text":"肠外营养没有统一的配方，但必须含人体所需的全部营养素"}],"answer":"C"},{"id":301,"chapter":"第十一章 合理营养指导","section":"A2","num":42,"stem":"某男孩，10岁，近半年感觉疲倦、头晕、乏力、心悸、呼吸急促、记忆力减退、学习注意力不集中。查血红蛋白90g/L,原卟啉大于500μg/L,最可能的原因是","options":[{"label":"A","text":"铁缺乏"},{"label":"B","text":"钙缺乏"},{"label":"C","text":"锌缺乏"},{"label":"D","text":"维生素缺乏"},{"label":"E","text":"烟酸缺乏"}],"answer":"A"},{"id":302,"chapter":"第十一章 合理营养指导","section":"A2","num":43,"stem":"某男孩，2 岁，查体发现方颅，枕秃，串珠胸，夜间经常啼哭，最可能的原因是","options":[{"label":"A","text":"受惊吓"},{"label":"B","text":"锌缺乏"},{"label":"C","text":"维生素 A 缺乏"},{"label":"D","text":"钙缺乏"},{"label":"E","text":"铁缺乏"}],"answer":"D"},{"id":303,"chapter":"第十一章 合理营养指导","section":"A2","num":44,"stem":"某患者临床症状为牙龈肿胀出血、结膜出血、毛囊角化、皮下淤斑、紫癜和关节疼痛等。临床诊断患者可能缺乏的哪一种营养素","options":[{"label":"A","text":"铁"},{"label":"B","text":"叶酸"},{"label":"C","text":"维生素 C"},{"label":"D","text":"维生素 B₁"},{"label":"E","text":"维生素 B₂"}],"answer":"C"},{"id":304,"chapter":"第十一章 合理营养指导","section":"A2","num":45,"stem":"某成年男性，因眼睛不适就诊；检查发现其暗适应能力下降，角膜干燥、发炎，球结膜出现泡状灰色斑点。最有可能的原因","options":[{"label":"A","text":"维生素 C"},{"label":"B","text":"维生素 A"},{"label":"C","text":"维生素 E"},{"label":"D","text":"维生素 B₁"},{"label":"E","text":"维生素 B₂"}],"answer":"B"},{"id":305,"chapter":"第十一章 合理营养指导","section":"A2","num":46,"stem":"生育后的产妇，营养状况良好，适合哪种膳食","options":[{"label":"A","text":"普通膳食"},{"label":"B","text":"软食"},{"label":"C","text":"流质"},{"label":"D","text":"半流质"},{"label":"E","text":"禁食"}],"answer":"D"},{"id":306,"chapter":"第十一章 合理营养指导","section":"A2","num":47,"stem":"一名患者临床症状表现为甲状腺肿，多汗等症状。临床诊断患者患有的哪一种营养缺乏病","options":[{"label":"A","text":"佝偻病"},{"label":"B","text":"碘缺乏病"},{"label":"C","text":"缺铁性贫血"},{"label":"D","text":"脚气病"},{"label":"E","text":"坏血病"}],"answer":"B"},{"id":307,"chapter":"第十一章 合理营养指导","section":"A2","num":48,"stem":"某儿童临床表现为水肿，尤其是以下肢水肿显著,虚弱、表情淡漠、生长滞缓，头发变色、变脆和易脱落，易感染等症状。临床诊断患者患有的哪一种营养缺乏病","options":[{"label":"A","text":"佝偻病"},{"label":"B","text":"锌缺乏病"},{"label":"C","text":"缺铁性贫血"},{"label":"D","text":"坏血病"},{"label":"E","text":"蛋白质-能量营养不良"}],"answer":"E"},{"id":308,"chapter":"第十一章 合理营养指导","section":"A2","num":49,"stem":"一名患者临床症状表现为口角裂纹、口腔黏膜溃疡及地图舌，鼻唇沟脂溢性皮炎，眼部的睑缘炎、角膜毛细血管增生及怕光等症状。临床诊断患者可能缺乏的哪一种营养素","options":[{"label":"A","text":"维生素 B₁"},{"label":"B","text":"维生素 B₂"},{"label":"C","text":"维生素 C"},{"label":"D","text":"维生素 D"},{"label":"E","text":"维生素 A"}],"answer":"B"},{"id":309,"chapter":"第十一章 合理营养指导","section":"A2","num":50,"stem":"某患者临床表现为巨幼红细胞性贫血、舌炎及胃肠道紊乱。临床诊断患者可能缺乏的哪","options":[{"label":"A","text":"叶酸"},{"label":"B","text":"维生素 D"},{"label":"C","text":"维生素 C"},{"label":"D","text":"维生素 B₁"},{"label":"E","text":"维生素 B₂"}],"answer":"A"},{"id":310,"chapter":"第十一章 合理营养指导","section":"A2","num":51,"stem":"某孕妇，妊娠反应强烈，不愿吃动物性食品，只吃水果和谷类食物，至妊娠中期，该孕妇感到手脚麻木、关节痛，并有抽筋现象。出现抽筋现象最可能的原因是","options":[{"label":"A","text":"血清铁含量低"},{"label":"B","text":"血清锌含量低"},{"label":"C","text":"血清钙含量低"},{"label":"D","text":"血清磷含量低"},{"label":"E","text":"血清钠含量低"}],"answer":"C"},{"id":311,"chapter":"第十一章 合理营养指导","section":"A2","num":52,"stem":"某5个月大的婴儿，出生后一直母乳喂养，此时母乳已不能完全满足其生长发育的需要，应添加一些断奶食物，但目前还不能食用","options":[{"label":"A","text":"鱼肝油"},{"label":"B","text":"肉末、肝末"},{"label":"C","text":"粥"},{"label":"D","text":"蛋黄"},{"label":"E","text":"菜泥、水果泥"}],"answer":"B"},{"id":312,"chapter":"第十一章 合理营养指导","section":"A2","num":53,"stem":"某患者临床症状为机体裸露部位的对称性皮炎。临床诊断患者可能缺乏的哪一种营养素?","options":[{"label":"A","text":"维生素 D"},{"label":"B","text":"烟酸"},{"label":"C","text":"维生素C"},{"label":"D","text":"维生素 B₁"},{"label":"E","text":"维生素 B₂"}],"answer":"B"},{"id":313,"chapter":"第十一章 合理营养指导","section":"A2","num":54,"stem":"某婴儿，11个月，出生后一直人工喂养牛奶，三个月时开始只添加辅食鸡蛋，发现该婴儿生长缓慢、面色苍白，最可能缺乏的营养素是","options":[{"label":"A","text":"铁"},{"label":"B","text":"维生素 A"},{"label":"C","text":"钙"},{"label":"D","text":"维生素 D"},{"label":"E","text":"维生素 C"}],"answer":"A"},{"id":314,"chapter":"第十一章 合理营养指导","section":"A2","num":55,"stem":"张先生因高血压住院治疗，血压稳定后医生建议张先生可以出院，并嘱咐其出院后宜多","options":[{"label":"A","text":"酒类"},{"label":"B","text":"盐腌渍食物"},{"label":"C","text":"油炸食物"},{"label":"D","text":"快餐食品"},{"label":"E","text":"水果蔬菜"}],"answer":"E"},{"id":315,"chapter":"第十一章 合理营养指导","section":"A2","num":56,"stem":"某患者临床表现为肾脏疾病，应该采用哪种治疗膳食","options":[{"label":"A","text":"高蛋白质膳食"},{"label":"B","text":"低盐膳食"},{"label":"C","text":"低嘌呤饮食"},{"label":"D","text":"低蛋白膳食"},{"label":"E","text":"高脂肪膳食"}],"answer":"D"},{"id":316,"chapter":"第十一章 合理营养指导","section":"A2","num":57,"stem":"某患者临床表现为痛风。应该采用哪种治疗膳食","options":[{"label":"A","text":"低蛋白膳食"},{"label":"B","text":"低盐膳食"},{"label":"C","text":"低嘌呤饮食"},{"label":"D","text":"高蛋白质膳食"},{"label":"E","text":"高脂肪膳食"}],"answer":"C"},{"id":317,"chapter":"第十一章 合理营养指导","section":"A2","num":58,"stem":"某术后患者临床表现为急性传染病、消化道出血、咀嚼困难等。临床上应采用哪种膳食","options":[{"label":"A","text":"普通膳食"},{"label":"B","text":"软食"},{"label":"C","text":"半流质膳食"},{"label":"D","text":"流质膳食"},{"label":"E","text":"低盐膳食"}],"answer":"D"},{"id":318,"chapter":"第十一章 合理营养指导","section":"A2","num":59,"stem":"某患者前来就医，主诉腿疼，腿肿，且活动不便，经检查其末梢感觉减弱，膝腱反射消失，腓肠肌压痛，反映此患者缺乏","options":[{"label":"A","text":"维生素 B₂"},{"label":"B","text":"维生素 B₁"},{"label":"C","text":"维生素 B₆"},{"label":"D","text":"维生素 B₁₂"},{"label":"E","text":"烟酸"}],"answer":"B"},{"id":319,"chapter":"第十一章 合理营养指导","section":"A2","num":60,"stem":"某女性患者，56 岁，体检发现患有肥胖和糖尿病。在选择碳水化合物时应注意选用","options":[{"label":"A","text":"膳食纤维含量少"},{"label":"B","text":"经过精细加工的主食"},{"label":"C","text":"血糖生成 ,"num":8,"stem":"导致人群易感性增高的因素是","options":[{"label":"A","text":"隐性感染"},{"label":"B","text":"易感人口的迁入"},{"label":"C","text":"传染病的流行"},{"label":"D","text":"预防接种"},{"label":"E","text":"易感人口的外迁"}],"answer":"B"},{"id":328,"chapter":"第十四章 传染病预防与控制","section":"A1","num":9,"stem":"可以经土壤形式传播的传染病是","options":[{"label":"A","text":"结核"},{"label":"B","text":"白喉"},{"label":"C","text":"霍乱"},{"label":"D","text":"狂犬病"},{"label":"E","text":"破伤风"}],"answer":"E"},{"id":329,"chapter":"第十四章 传染病预防与控制","section":"A1","num":10,"stem":"疫源地的大小取决于","options":[{"label":"A","text":"传染源排出病原体的数量"},{"label":"B","text":"传播途径的特点，对人群采取的防治措施"},{"label":"C","text":"传染源数量的多少及其活动范围"},{"label":"D","text":"传染源的活动范围、传播途径的特点、周围人群的免疫状况"},{"label":"E","text":"传染源的多少"}],"answer":"D"},{"id":330,"chapter":"第十四章 传染病预防与控制","section":"A1","num":11,"stem":"必须实施隔离治疗的传染病是","options":[{"label":"A","text":"艾滋病，肺结核，肺炭疽"},{"label":"B","text":"白喉、肺炭疽和高致病性禽流感"},{"label":"C","text":"艾滋病、肺炭疽和肺结核"},{"label":"D","text":"艾滋病、SARS 和肺炭疽"},{"label":"E","text":"艾滋病、疯牛病和肺炭疽"}],"answer":"D"},{"id":331,"chapter":"第十四章 传染病预防与控制","section":"A1","num":12,"stem":"确定接触者的留验、检疫和医学观察期限的依据是","options":[{"label":"A","text":"传染病类型"},{"label":"B","text":"潜伏期长短"},{"label":"C","text":"传染期"},{"label":"D","text":"传染源的病程"},{"label":"E","text":"传染源有无典型临床症状"}],"answer":"B"},{"id":332,"chapter":"第十四章 传染病预防与控制","section":"A1","num":13,"stem":"受自然因素影响最明显的是","options":[{"label":"A","text":"传染源"},{"label":"B","text":"传播途径"},{"label":"C","text":"易感人群"},{"label":"D","text":"传播途径和易感人群"},{"label":"E","text":"传染源和易感人群"}],"answer":"B"},{"id":333,"chapter":"第十四章 传染病预防与控制","section":"A1","num":14,"stem":"病原携带者作为传染源的意义不取决于","options":[{"label":"A","text":"携带病原体的种类"},{"label":"B","text":"排出病原体的数量、时间"},{"label":"C","text":"携带者的职业、生活习惯"},{"label":"D","text":"携带者的活动范围"},{"label":"E","text":"易感人口的多少"}],"answer":"E"},{"id":334,"chapter":"第十四章 传染病预防与控制","section":"A1","num":15,"stem":"主要经飞沫传播的病原体","options":[{"label":"A","text":"百日咳杆菌"},{"label":"B","text":"结核杆菌"},{"label":"C", "text":"地方性甲状腺肿"},{"label":"B","text":"痛痛病"},{"label":"C","text":"布氏菌病"},{"label":"D","text":"佝偻病"},{"label":"E","text":"甲型肝炎"}],"answer":"A"},{"id":390,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":22,"stem":"多种污染物的联合作用不包括","options":[{"label":"A","text":"协同作用"},{"label":"B","text":"增强作用"},{"label":"C","text":"蓄积作用"},{"label":"D","text":"拮抗作用"},{"label":"E","text":"相加作用"}],"answer":"C"},{"id":391,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":23,"stem":"引起生物地球化学性疾病的主要原因是","options":[{"label":"A","text":"工业废弃物的排放"},{"label":"B","text":"生物性病原体的传播"},{"label":"C","text":"某些有害化学物污染环境"},{"label":"D","text":"环境中生物种群比例失调"},{"label":"E","text":"原生环境中某些元素含量过多或过少"}],"answer":"E"},{"id":392,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":24,"stem":"目前在建筑材料与装饰材料中最引起人们关注的污染物质是","options":[{"label":"A","text":"甲醇、氨和氡"},{"label":"B","text":"甲醛、氡"},{"label":"C","text":"甲醇和铅"},{"label":"D","text":"苯和苯系物、铅"},{"label":"E","text":"甲醇和苯系物"}],"answer":"B"},{"id":393,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":25,"stem":"地方性甲状腺肿发病的主要原因是","options":[{"label":"A","text":"铁摄入不足"},{"label":"B","text":"锌摄入不足"},{"label":"C","text":"碘摄入不足"},{"label":"D","text":"硒摄入不足"},{"label":"E","text":"氟摄入不足"}],"answer":"C"},{"id":394,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":26,"stem":"预防碘缺乏病不包括","options":[{"label":"A","text":"食盐加碘"},{"label":"B","text":"多吃海产品"},{"label":"C","text":"服用碘剂"},{"label":"D","text":"肌内注射补碘"},{"label":"E","text":"服用促甲状腺激素"}],"answer":"E"},{"id":395,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":27,"stem":"可导致生物地球化学性疾病的化学元素是","options":[{"label":"A","text":"磷"},{"label":"B","text":"汞"},{"label":"C","text":"碘"},{"label":"D","text":"铁"},{"label":"E","text":"铬"}],"answer":"C"},{"id":396,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":28,"stem":"预防地方性甲状腺肿流行的最有效措施是","options":[{"label":"A","text":"食用碘盐"},{"label":"B","text":"改良水源"},{"label":"C","text":"煮沸饮水"},{"label":"D","text":"降低饮用水的硬度"},{"label":"E","text":"饮水除氟"}],"answer":"A"},{"id":397,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":29,"stem":"介水传染病大多是","options":[{"label":"A","text":"皮肤病"},{"label":"B","text":"呼吸道传染病"},{"label":"C","text":"机体免疫性疾病"},{"label":"D","text":"肠道传染病"},{"label":"E","text":"中毒性疾病"}],"answer":"D"},{"id":398,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":30,"stem":"严重环境污染引起的一类地区性中毒性疾病称为","options":[{"label":"A","text":"痛痛病"},{"label":"B","text":"水俣病"},{"label":"C","text":"地方病"},{"label":"D","text":"公害病"},{"label":"E","text":"介水传染病"}],"answer":"D"},{"id":399,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":31,"stem":"生物标志物分为","options":[{"label":"A","text":"接触性生物标志物和易感性生物标志物"},{"label":"B","text":"易感性生物标志物和效应性生物标志物"},{"label":"C","text":"接触性生物标志物、易感性生物标志物和效应性生物标志物"},{"label":"D","text":"效应性生物标志物和接触性生物标志物"},{"label":"E","text":"以上都不是"}],"answer":"C"},{"id":400,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":32,"stem":"下列说法正确的是","options":[{"label":"A","text":"剂量-反应关系是确定有害物质暴露人群中有害效应发生率的估计值"},{"label":"B","text":"剂量-反应关系是针对个体而言"},{"label":"C","text":"剂量-效应关系是化学物质的摄入量与摄入该化学物质的生物机体呈现某种生物学效 应程度之间的关系"},{"label":"D","text":"剂量-效应关系是暴露水平与疾病发生率之间的关系"},{"label":"E","text":"剂量-反应关系既可对群体也可对个体暴露水平进行估计"}],"answer":"C"},{"id":401,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":33,"stem":"环境有害因素的主要接触途径是","options":[{"label":"A","text":"土壤、食物、空气"},{"label":"B","text":"土壤、食物、水"},{"label":"C","text":"食物、空气、水"},{"label":"D","text":"食物、空气、皮肤"},{"label":"E","text":"呼吸道、消化道、皮肤"}],"answer":"E"},{"id":402,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":34,"stem":"环境污染物危险度评价中的暴露评价可以估计出","options":[{"label":"A","text":"某化学物对机体产生危害的程度"},{"label":"B","text":"某化学物在环境介质中的浓度"},{"label":"C","text":"人群对某化学物暴露的强度、频率和持续时间"},{"label":"D","text":"某化学物是否对机体产生危害"},{"label":"E","text":"某化学物在人群中暴露剂量"}],"answer":"C"},{"id":403,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A1","num":35,"stem":"环境有害因素的预防与控制策略不包括","options":[{"label":"A","text":"开展环境教育，提高全民环境意识"},{"label":"B","text":"强化环境管理，依法进行监督"},{"label":"C","text":"加强环境科学技术研究"},{"label":"D","text":"采取先进的污染防治技术"},{"label":"E","text":"加强体育锻炼"}],"answer":"E"},{"id":404,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":36,"stem":"某生产氯气的工厂，由于管道的溢漏，致使当地主导风向下风侧居民出现头痛、头昏、恶心、呕吐等现象，此种情况应判断为","options":[{"label":"A","text":"慢性中毒"},{"label":"B","text":"中毒危害"},{"label":"C","text":"中度中毒"},{"label":"D","text":"急性中毒"},{"label":"E","text":"亚急性中毒"}],"answer":"D"},{"id":405,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":38,"stem":"某患者常年生活在山区，主诉近一个月感到呼吸困难同时伴有吞咽困难，有时还有声音嘶哑的现象。临床检查，该患者甲状腺肿大超过本人拇指末节。尿碘50μg/g肌酐，甲状腺吸13I率呈饥饿曲线。临床医生初步诊断患者可能患有的疾病是","options":[{"label":"A","text":"上呼吸道炎症"},{"label":"B","text":"消化道疾病"},{"label":"C","text":"甲状腺炎"},{"label":"D","text":"喉部肿物"},{"label":"E","text":"地方性甲状腺肿"}],"answer":"E"},{"id":406,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":39,"stem":"某患者，男，15岁，长期在山区生活，因走步不稳，运动不灵活入院检查。经检查发现X线表现骨龄落后和骨骺愈合延迟；血清T₄降低；促甲状腺激素升高。皮肤和毛发干燥，整体发育低于同龄人。你认为该患者可能患的疾病是","options":[{"label":"A","text":"营养缺乏性疾病"},{"label":"B","text":"维生素 D 缺乏"},{"label":"C","text":"地方性甲状腺肿"},{"label":"D","text":"地方性克汀病"},{"label":"E","text":"氟骨症"}],"answer":"D"},{"id":407,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":40,"stem":"1930年12月1～5日的几天里，比利时马斯河谷工业区上空出现了很强的逆温层，致使13个大烟囱排出的烟尘无法扩散，大量有害气体积累在附近大气层，对人体造成严重伤害。一周内有60多人丧生，其中心脏病、肺病患者死亡率最高，许多牲畜死亡。这一事件属于","options":[{"label":"A","text":"意外事故"},{"label":"B","text":"自然现象"},{"label":"C","text":"急性危害"},{"label":"D","text":"自然灾害"},{"label":"E","text":"慢性危害"}],"answer":"C"},{"id":408,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":41,"stem":"美国的宾夕法尼亚州多诺拉城有许多大型炼铁厂、炼锌厂和硫酸厂。1948年10月26日清晨，大雾弥漫，受逆温的影响，工厂排出的有害气体扩散不出去，全城14:000人中有5900人眼痛、喉咙痛、头痛胸闷、呕吐、腹泻。17人死亡。你认为这一现象最可能的污染物是","options":[{"label":"A","text":"烟尘和二氧化硫"},{"label":"B","text":"NO₂ 和二氧化硫"},{"label":"C","text":"烟尘和三氧化硫"},{"label":"D","text":"CO 和烟尘"},{"label":"E","text":"CO 和 NO₂"}],"answer":"A"},{"id":409,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":43,"stem":"张某入住新房两个月后出现头痛、头昏、失眠、多梦、记忆力减退、牙龈出血。入院检查：神志清楚，呈贫血面容，血压110/65mmHg,心肺(一),白细胞、中性粒细胞、血小板、红细胞、血红蛋白均低于正常值，该患者最可能的病因是","options":[{"label":"A","text":"锌缺乏"},{"label":"B","text":"蛋白质缺乏"},{"label":"C","text":"铁缺乏"},{"label":"D","text":"血小板减少"},{"label":"E","text":"装饰材料释放有害物质引起中毒"}],"answer":"E"},{"id":410,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":44,"stem":"某县对学龄儿童进行健康体检，发现其中一个镇的大部分儿童智力低下，而其他方面发育正常，应重点考虑这些儿童可能是","options":[{"label":"A","text":"铅中毒"},{"label":"B","text":"汞中毒"},{"label":"C","text":"氟中毒"},{"label":"D","text":"碘缺乏"},{"label":"E","text":"锌缺乏"}],"answer":"D"},{"id":411,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":45,"stem":"湖北省某山区一农民，45岁，因全身关节和骨骼疼痛前来就诊。患者称早上起床时，感觉全身关节和骨骼疼痛，外出活动和劳动后减轻。无重大疾病史，家族中无相似病例。患者轻微驼背，牙齿有少量的断裂和缺损，釉面有色素沉着。该患者最有可能是","options":[{"label":"A","text":"风湿症"},{"label":"B","text":"汞中毒"},{"label":"C","text":"氟中毒"},{"label":"D","text":"碘缺乏"},{"label":"E","text":"软骨症"}],"answer":"C"},{"id":412,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":46,"stem":"在1955年11月～1956年1月间，印度新德里由于集中式水源受生活污水污染引起甲型肝炎大流行，在170万人口中仅黄疸病例就有29300人。该事件引起的甲型肝炎属于","options":[{"label":"A","text":"介水传染病"},{"label":"B","text":"非传染性疾病"},{"label":"C","text":"人畜共患性疾病"},{"label":"D","text":"化学性污染引起的疾病"},{"label":"E","text":"放射性污染引起的疾病"}],"answer":"A"},{"id":413,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":47,"stem":"2005 年中国石油吉林石化分公司工厂爆炸引发松花江水污染，其主要的污染物质是","options":[{"label":"A","text":"铅"},{"label":"B","text":"汞"},{"label":"C","text":"酚类"},{"label":"D","text":"氰化物"},{"label":"E","text":"苯系化合物"}],"answer":"E"},{"id":414,"chapter":"第十六章 环境相关疾病及其预防控制","section":"A2","num":48,"stem":"患者，女，12岁。因牙齿黄、缺损不美观，到口腔科就诊。患者主诉，10年前她的牙齿就变黄、变黑并开始脱落。家人也有类似症状，父母身体不好，常年腰腿疼痛，骨关节变形。该患者牙齿病变最可能的原因是","options":[{"label":"A","text":"铅中毒"},{"label":"B","text":"汞中毒"},{"label":"C","text":"氟中毒"},{"label":"D","text":"镉中毒"},{"label":"E","text":"遗传疾病"}],"answer":"C"},{"id":415,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":1,"stem":"职业卫生的研究对象","options":[{"label":"A","text":"职业人群"},{"label":"B","text":"作业环境"},{"label":"C","text":"不良劳动条件"},{"label":"D","text":"职业人群和作业环境"},{"label":"E","text":"以上都是"}],"answer":"D"},{"id":416,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":2,"stem":"职业性疾病的产生条件","options":[{"label":"A","text":"职业性有害因素"},{"label":"B","text":"作用条件"},{"label":"C","text":"个体危险因素"},{"label":"D","text":"以上出现其中一个就可能导致职业病"},{"label":"E","text":"只有满足三个条件时才可能导致职业病"}],"answer":"E"},{"id":417,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":3,"stem":"接触职业性有害因素的劳动者是否发生职业性疾患，主要取决于","options":[{"label":"A","text":"强度和时间"},{"label":"B","text":"接触机会"},{"label":"C","text":"接触方式"},{"label":"D","text":"人体的健康状况"},{"label":"E","text":"有害因素种类"}],"answer":"A"},{"id":418,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":4,"stem":"下列关于职业病的说法错误的是","options":[{"label":"A","text":"病因有特异性，在控制接触后可以控制或消除发病"},{"label":"B","text":"病因大多可以检测，一般无接触水平(剂量-反应)关系"},{"label":"C","text":"在接触同样有害因素的人群中，常有一定比例的接触者发病"},{"label":"D","text":"如能早发现，早诊断，及时给予处理和治疗，预后均较好"},{"label":"E","text":"大多数职业病，目前尚缺乏特效治疗，应着重于保护人群健康的预防措施"}],"answer":"B"},{"id":419,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":5,"stem":"职业病有以下特点，除外","options":[{"label":"A","text":"病因明确"},{"label":"B","text":"存在剂量(接触水平)-反应关系"},{"label":"C","text":"接触人群中常有一定发病率"},{"label":"D","text":"症状典型，多有特效疗法"},{"label":"E","text":"早期发现，及时处理，预后良好"}],"answer":"D"},{"id":420,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":6,"stem":"目前我国法定职业病包括","options":[{"label":"A","text":"3 类 109 种"},{"label":"B","text":"9 类 109 种"},{"label":"C","text":"10 类 109 种"},{"label":"D","text":"10 类 132 种"},{"label":"E","text":"9 类 132 种"}],"answer":"D"},{"id":421,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":7,"stem":"法定职业病中职业性肿瘤有","options":[{"label":"A","text":"9 种"},{"label":"B","text":"10 种"},{"label":"C","text":"11 种"},{"label":"D","text":"12 种"},{"label":"E","text":"7 种"}],"answer":"C"},{"id":422,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":8,"stem":"下列属于化学性职业性有害因素的是","options":[{"label":"A","text":"X 射线与粉尘"},{"label":"B","text":"粉尘与毒物"},{"label":"C","text":"毒物与细菌"},{"label":"D","text":"细菌与过度紧张"},{"label":"E","text":"过度紧张与病毒"}],"answer":"B"},{"id":423,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":9,"stem":"生产环境中易引起职业中毒的毒物形式主要是","options":[{"label":"A","text":"固态、液态、气态或气溶胶"},{"label":"B","text":"固态、液态"},{"label":"C","text":"液态、气态"},{"label":"D","text":"气态或气溶胶"},{"label":"E","text":"固态、气态或气溶胶"}],"answer":"D"},{"id":424,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":10,"stem":"下列不属于刺激性气体的是","options":[{"label":"A","text":"氨气"},{"label":"B","text":"一氧化碳"},{"label":"C","text":"二氧化氮"},{"label":"D","text":"氯气"},{"label":"E","text":"二氧化硫"}],"answer":"B"},{"id":425,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":11,"stem":"职业性中毒是由于接触下列哪一类有害因素而引起","options":[{"label":"A","text":"生产中各种化学物"},{"label":"B","text":"化学物"},{"label":"C","text":"生产性毒物"},{"label":"D","text":"各种有害因素"},{"label":"E","text":"化学原料"}],"answer":"C"},{"id":426,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":12,"stem":"下列针对职业性有害物理因素的说法正确的是","options":[{"label":"A","text":"应设法消除这些物理因素"},{"label":"B","text":"应将其减少到越低越好"},{"label":"C","text":"应设法将这些因素控制在合理范围内，不必消除，也不是越低越好"},{"label":"D","text":"对物理因素所致的损伤或疾病的治疗，大多需要采用“驱除”或“排出”的方法"},{"label":"E","text":"物理因素对人体的损害效应与物理参数之间一般呈直线相关关系"}],"answer":"C"},{"id":427,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":13,"stem":"以下不属于物理性有害因素的是","options":[{"label":"A","text":"高温、高湿"},{"label":"B","text":"电离辐射"},{"label":"C","text":"噪声"},{"label":"D","text":"非电离辐射"},{"label":"E","text":"生产性粉尘"}],"answer":"E"},{"id":428,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":14,"stem":"生产环境中的各种气象条件构成了工作场所的微小气候，包括的主要因素有","options":[{"label":"A","text":"气温、气压、湿度、风速、噪声、振动、热辐射"},{"label":"B","text":"气温、气压、噪声、振动、非电离辐射、电离辐射"},{"label":"C","text":"气温、湿度、风速、非电离辐射、电离辐射、照度"},{"label":"D","text":"气压、湿度、风速、振动、非电离辐射、电离辐射"},{"label":"E","text":"气温、气压、湿度、风速、非电离辐射、电离辐射"}],"answer":"B"},{"id":429,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":15,"stem":"高温作业指工作场所存在生产性热源，其工作场所的气温高于室外","options":[{"label":"A","text":"1℃"},{"label":"B","text":"2℃"},{"label":"C","text":"3℃"},{"label":"D","text":"4℃"},{"label":"E","text":"5℃"}],"answer":"B"},{"id":430,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":16,"stem":"列入中国法定职业病的是","options":[{"label":"A","text":"听觉适应"},{"label":"B","text":"听觉疲劳"},{"label":"C","text":"听力损失"},{"label":"D","text":"噪声性耳聋"},{"label":"E","text":"以上均是"}],"answer":"D"},{"id":431,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":17,"stem":"暂时性听阈位移是指","options":[{"label":"A","text":"指人或动物接触噪声后听阈的提高 10～30dB,脱离噪声环境后经过一段时间听力不 可以恢复到原来水平"},{"label":"B","text":"指人或动物接触噪声后听阈的提高 10～30dB,脱离噪声环境后经过一段时间听力可 以恢复到原来水平"},{"label":"C","text":"噪声引起的不能恢复到正常水平的听阈升高"},{"label":"D","text":"是一种病理性改变"},{"label":"E","text":"包括听觉适应和听力损失"}],"answer":"B"},{"id":432,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":18,"stem":"非电离辐射不包括","options":[{"label":"A","text":"微波"},{"label":"B","text":"红外线"},{"label":"C","text":"紫外线"},{"label":"D","text":"可见光"},{"label":"E","text":"γ 射线"}],"answer":"E"},{"id":433,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":19,"stem":"在职业性中毒的诊断过程中，具体重要意义的前提条件是","options":[{"label":"A","text":"职业史"},{"label":"B","text":"生产环境监测资料"},{"label":"C","text":"实验室检查"},{"label":"D","text":"临床症状"},{"label":"E","text":"体征"}],"answer":"A"},{"id":434,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":20,"stem":"我国法定职业病中尘肺有","options":[{"label":"A","text":"10 类"},{"label":"B","text":"11 类"},{"label":"C","text":"12 类"},{"label":"D","text":"13 类"},{"label":"E","text":"14 类"}],"answer":"D"},{"id":435,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":21,"stem":"吸入如下何种粉尘可导致全身中毒","options":[{"label":"A","text":"石棉尘"},{"label":"B","text":"矽尘"},{"label":"C","text":"铅尘"},{"label":"D","text":"有机粉尘."},{"label":"E","text":"煤尘"}],"answer":"C"},{"id":436,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":22,"stem":"在生产环境中呼吸性粉尘的空气动力学直径为","options":[{"label":"A","text":"<15μm"},{"label":"B","text":">15μm"},{"label":"C","text":"<10μm"},{"label":"D","text":"<5μm"},{"label":"E","text":"<lμm"}],"answer":"D"},{"id":437,"chapter":"第十七章 职业相关疾病及职业卫生服务","section":"A1","num":23,"stem":"与粉尘在呼吸道的阻留有 "text":"C₂"}],"answer":"C"},{"id":458,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":2,"stem":"对 N- 亚硝基化合物致癌作用有抵抗力的动物是","options":[{"label":"A","text":"豚鼠"},{"label":"B","text":"猫"},{"label":"C","text":"黑舌狗"},{"label":"D","text":"猴"},{"label":"E","text":"尚未发现"}],"answer":"E"},{"id":459,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":3,"stem":"陶瓷容器中可能移入食品的有害金属是","options":[{"label":"A","text":"铅、镉"},{"label":"B","text":"铁、锌"},{"label":"C","text":"铜、钴"},{"label":"D","text":"钼、镍"},{"label":"E","text":"铬、锡"}],"answer":"A"},{"id":460,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":4,"stem":"我国规定婴儿代乳品中黄曲霉毒素 B₁ 的允许量为","options":[{"label":"A","text":"≤20pg/kg"},{"label":"B","text":"≤10μg/kg"},{"label":"C","text":"≤5μg/kg"},{"label":"D","text":"≤1μg/kg"},{"label":"E","text":"不得检出"}],"answer":"E"},{"id":461,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":5,"stem":"在一批腌菜中检出大量硝酸盐，在适宜的条件下它们可以和胺类形成","options":[{"label":"A","text":"亚硝胺"},{"label":"B","text":"色胺"},{"label":"C","text":"腐胺"},{"label":"D","text":"甲胺"},{"label":"E","text":"组胺"}],"answer":"A"},{"id":462,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":6,"stem":"有害金属镉主要蓄积的部位是","options":[{"label":"A","text":"肝"},{"label":"B","text":"肾"},{"label":"C","text":"大脑"},{"label":"D","text":"心脏"},{"label":"E","text":"肺"}],"answer":"B"},{"id":463,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":7,"stem":"下列哪一种食品添加剂通过与肉制品中肌红蛋白发生化学反应使肉制品呈鲜红色","options":[{"label":"A","text":"红曲米"},{"label":"B","text":"苋菜红"},{"label":"C","text":"赤鲜红"},{"label":"D","text":"亚硫酸钠"},{"label":"E","text":"亚硝酸钠"}],"answer":"E"},{"id":464,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":8,"stem":"食品不得加入药物，但是按照传统既是食品又是药品作为下列哪种情况加入的除外","options":[{"label":"A","text":"营养强化剂"},{"label":"B","text":"抗氧化剂"},{"label":"C","text":"防腐剂"},{"label":"D","text":"着色剂"},{"label":"E","text":"酶制剂"}],"answer":"A"},{"id":465,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":9,"stem":"下列哪种是允许使用的食用合成色素","options":[{"label":"A","text":"姜黄"},{"label":"B","text":"柠檬黄"},{"label":"C","text":"红曲"},{"label":"D","text":"虫胶红酸"},{"label":"E","text":"硝酸钠"}],"answer":"B"},{"id":466,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":10,"stem":"目前常用的食品发色剂是","options":[{"label":"A","text":"苋菜红"},{"label":"B","text":"亚硝酸盐"},{"label":"C","text":"亚硫酸铜"},{"label":"D","text":"赤鲜红"},{"label":"E","text":"红曲米"}],"answer":"B"},{"id":467,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":11,"stem":"食物中毒是","options":[{"label":"A","text":"因暴饮暴食引起的急性胃肠炎"},{"label":"B","text":"食源性疾病的总称"},{"label":"C","text":"有毒食物引起的急慢性中毒"},{"label":"D","text":"经食物传播的各种疾病"},{"label":"E","text":"正常人在正常情况下，经口摄入正常数量的、可食状态食物后，所发生的非传染性急 性 或亚急性疾病"}],"answer":"E"},{"id":468,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":12,"stem":"引起副溶血性弧菌中毒的常见食物是","options":[{"label":"A","text":"奶类"},{"label":"B","text":"肉类"},{"label":"C","text":"海产品"},{"label":"D","text":"发酵食品"},{"label":"E","text":"腌制食品"}],"answer":"C"},{"id":469,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":13,"stem":"当前，我国引起细菌性食物中毒的首位食品是","options":[{"label":"A","text":"豆类及其制品"},{"label":"B","text":"肉类及其制品"},{"label":"C","text":"蛋类及其制品"},{"label":"D","text":"奶类及其制品"},{"label":"E","text":"谷类及其制品"}],"answer":"B"},{"id":470,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":14,"stem":"在夏秋季，细菌性食物中毒是食物中毒中最常见的一类疾病。变形杆菌引起的食物中毒与细菌性痢疾的根本区别是","options":[{"label":"A","text":"潜伏期短，发病突然"},{"label":"B","text":"发病与食物有关"},{"label":"C","text":"人与人之间不会直接传染"},{"label":"D","text":"患者具有相同或相似的临床症状"},{"label":"E","text":"发病曲线上升"}],"answer":"C"},{"id":471,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":15,"stem":"有一类鱼如鲐巴鱼，含组氨酸丰富，当鱼体不新鲜时或腐败时，易形成大量有毒作用物质，食用后引起中毒，其主要症状表现为","options":[{"label":"A","text":"四肢肌肉麻木，失去运动能力"},{"label":"B","text":"面部、胸部及全身皮肤潮红"},{"label":"C","text":"色觉和位置觉错乱，视觉模糊"},{"label":"D","text":"颜面肿胀、疼痛"},{"label":"E","text":"结膜、面部及全身皮肤发绀"}],"answer":"B"},{"id":472,"chapter":"第十八章 食品安全与食源性疾病","section":"A1","num":16,"stem":"亚硝酸盐食物中毒的机理是","options":[{"label":"A","text":"巯基酶失活"},{"label":"B","text":"胆碱酯酶活性被抑制"},{"label":"C","text":"溶血作用"},{"label":
