A1","num":22,"stem":"防护服按其防护性能可分为几级","options":[{"label":"A","text":"一级"},{"label":"B","text":"二级"},{"label":"C","text":"三级"},{"label":"D","text":"四级"},{"label":"E","text":"五级"}],"answer":"D"},{"id":500,"chapter":"第二十章 突发公共卫生事件及其应急策略","section":"A1","num":23,"stem":"不属于疑似群体性不明原因传染病的救治原则是","options":[{"label":"A","text":"隔离患者"},{"label":"B","text":"病原治疗"},{"label":"C","text":"一般治疗"},{"label":"D","text":"对症治疗"},{"label":"E","text":"尽早解毒"}],"answer":"E"}];
  // Populate chapter dropdown
  const chapters = [...new Set(allQuestions.map(q => q.chapter))];
  const sel = document.getElementById('chapterSelect');
  chapters.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch;
    opt.textContent = ch;
    sel.appendChild(opt);
  });
  applyFilter();
  loadHistory();
  renderQuestion();
  updateStats();
  updateGrid();
}

// ========== FILTER ==========
function applyFilter() {
  const ch = document.getElementById('chapterSelect').value;
  let pool = ch === 'all' ? [...allQuestions] : allQuestions.filter(q => q.chapter === ch);
  // Wrong mode: only show questions that were ever wrong
  if (wrongMode) {
    pool = pool.filter(q => history[q.id] && history[q.id].wrongEver);
  }
  filteredQuestions = pool;
  currentIndex = 0;
}

function onChapterChange() {
  applyFilter();
  renderQuestion();
  updateStats();
  updateGrid();
}

// ========== MODE ==========
function setMode(m) {
  mode = m;
  document.getElementById('btnSequential').classList.toggle('active', m === 'sequential');
  document.getElementById('btnRandom').classList.toggle('active', m === 'random');
  if (m === 'random') {
    currentIndex = Math.floor(Math.random() * filteredQuestions.length);
  }
  renderQuestion();
}

function toggleWrongMode() {
  wrongMode = !wrongMode;
  const btn = document.getElementById('btnWrongMode');
  const badge = document.getElementById('wrongBadge');
  btn.classList.toggle('active', wrongMode);
  badge.classList.toggle('active', wrongMode);
  applyFilter();
  renderQuestion();
  updateStats();
  updateGrid();
}

function clearWrongAnswers() {
  if (!confirm('确定要清除所有错题记录吗？（答题进度保留，仅清除错题标记）')) return;
  for (const key in history) {
    history[key].wrongEver = false;
  }
  if (wrongMode) {
    wrongMode = false;
    document.getElementById('btnWrongMode').classList.remove('active');
    document.getElementById('wrongBadge').classList.remove('active');
    applyFilter();
    renderQuestion();
  }
  saveHistory();
  updateStats();
  updateGrid();
}

// ========== QUESTION RENDERING ==========
function renderQuestion() {
  if (filteredQuestions.length === 0) {
    document.getElementById('optionsContainer').innerHTML = '';
    document.getElementById('answerReveal').classList.remove('show');
    document.getElementById('qCounter').textContent = wrongMode ? '错题集为空' : '0 / 0';
    document.getElementById('progressFill').style.width = '0%';
    if (wrongMode) {
      document.getElementById('qStem').innerHTML = '<div class="empty-state"><div class="empty-icon">🎉</div><p>错题集已清空！</p><p style="font-size:13px;margin-top:4px">所有错题已全部掌握，太棒了！</p></div>';
      document.getElementById('qNum').textContent = '🎯';
      document.getElementById('qChapter').textContent = '';
      document.getElementById('qSection').textContent = '';
    } else {
      document.getElementById('qStem').textContent = '没有题目';
    }
    return;
  }
  if (currentIndex >= filteredQuestions.length) currentIndex = 0;
  if (currentIndex < 0) currentIndex = filteredQuestions.length - 1;

  const q = filteredQuestions[currentIndex];
  document.getElementById('qNum').textContent = `Q${q.id}`;
  document.getElementById('qChapter').textContent = q.chapter;
  document.getElementById('qSection').textContent = `【${q.section}型题】第${q.num}题`;
  document.getElementById('qStem').textContent = q.stem;
  document.getElementById('qCounter').textContent = `${currentIndex + 1} / ${filteredQuestions.length}`;

  // Options
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="option-letter">${opt.label}</span><span class="option-text">${opt.text}</span>`;
    div.onclick = () => selectOption(opt.label, div);
    container.appendChild(div);
  });

  // Reset answer reveal & option states
  document.getElementById('answerReveal').classList.remove('show');
  document.getElementById('btnShowAnswer').textContent = '查看答案';
  document.getElementById('btnShowAnswer').disabled = false;

  // Restore previous state
  if (history[q.id] && history[q.id].selected) {
    const prevLabel = history[q.id].selected;
    const opts = container.querySelectorAll('.option');
    opts.forEach(o => {
      const letter = o.querySelector('.option-letter').textContent;
      if (letter === prevLabel) {
        o.classList.add('selected');
        if (history[q.id].result === 'correct') o.classList.add('correct');
        if (history[q.id].result === 'wrong') o.classList.add('wrong');
      }
      if (letter === q.answer && history[q.id].result) {
        o.classList.add('correct');
      }
    });
    if (history[q.id].result) {
      showAnswerResult(history[q.id].result, q);
    }
  }

  // Progress bar
  const done = Object.keys(history).filter(k => {
    const qs = filteredQuestions.find(fq => fq.id === parseInt(k));
    return qs !== undefined;
  }).length;
  document.getElementById('progressFill').style.width = (done / filteredQuestions.length * 100) + '%';
  document.getElementById('headerInfo').textContent = `${done}/${filteredQuestions.length}`;

  updateGridHighlight();
}

function selectOption(label, el) {
  const q = filteredQuestions[currentIndex];
  // Don't allow re-selection if already answered
  if (history[q.id] && history[q.id].result) return;

  // Clear previous selection in this question
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');

  // Save selection
  if (!history[q.id]) history[q.id] = {};
  history[q.id].selected = label;
  saveHistory();

  // Auto-show answer immediately
  showAnswer();
}

function showAnswer() {
  const q = filteredQuestions[currentIndex];
  const selected = history[q.id] ? history[q.id].selected : null;

  if (selected) {
    // Already selected — check if correct
    const isCorrect = selected === q.answer;
    history[q.id].result = isCorrect ? 'correct' : 'wrong';
    // Track wrong answers permanently for 错题集
    if (!isCorrect) history[q.id].wrongEver = true;
    // Mark options
    const opts = document.querySelectorAll('.option');
    opts.forEach(o => {
      const letter = o.querySelector('.option-letter').textContent;
      if (letter === q.answer) o.classList.add('correct');
      if (letter === selected && !isCorrect) o.classList.add('wrong');
    });
    showAnswerResult(isCorrect ? 'correct' : 'wrong', q);
    document.getElementById('btnShowAnswer').textContent = '已判定';
    document.getElementById('btnShowAnswer').disabled = true;
    saveHistory();
    updateStats();
    updateGrid();
  } else {
    // No selection — just reveal the answer
    const opts = document.querySelectorAll('.option');
    opts.forEach(o => {
      const letter = o.querySelector('.option-letter').textContent;
      if (letter === q.answer) o.classList.add('correct');
    });
    showAnswerResult(null, q);
  }
}

function showAnswerResult(result, q) {
  const reveal = document.getElementById('answerReveal');
  const label = document.getElementById('ansLabel');
  const detail = document.getElementById('ansDetail');
  reveal.classList.add('show');

  if (result === 'correct') {
    label.innerHTML = '✅ 回答正确！';
    label.style.color = 'var(--correct)';
  } else if (result === 'wrong') {
    label.innerHTML = '❌ 回答错误';
    label.style.color = 'var(--wrong)';
  } else {
    label.innerHTML = '💡 参考答案';
    label.style.color = 'var(--accent)';
  }
  detail.textContent = `正确答案：${q.answer}`;
}

function prevQuestion() {
  if (filteredQuestions.length === 0) return;
  if (mode === 'random') {
    currentIndex = Math.floor(Math.random() * filteredQuestions.length);
  } else {
    currentIndex = currentIndex > 0 ? currentIndex - 1 : filteredQuestions.length - 1;
  }
  renderQuestion();
  document.getElementById('questionCard').scrollIntoView({ behavior: 'smooth' });
}

function nextQuestion() {
  if (filteredQuestions.length === 0) return;
  const q = filteredQuestions[currentIndex];
  // Auto-advance if in sequential mode and answer already revealed
  if (mode === 'random') {
    currentIndex = Math.floor(Math.random() * filteredQuestions.length);
  } else {
    currentIndex = currentIndex < filteredQuestions.length - 1 ? currentIndex + 1 : 0;
  }
  renderQuestion();
  document.getElementById('questionCard').scrollIntoView({ behavior: 'smooth' });
}

// ========== STATS ==========
function updateStats() {
  const filtered = filteredQuestions;
  const doneIds = Object.keys(history).filter(k => {
    return history[k].result && filtered.find(q => q.id === parseInt(k));
  });
  const correctIds = doneIds.filter(k => history[k].result === 'correct');
  const wrongEverIds = Object.keys(history).filter(k => history[k].wrongEver && filtered.find(q => q.id === parseInt(k)));
  document.getElementById('statTotal').textContent = filtered.length;
  document.getElementById('statDone').textContent = doneIds.length;
  document.getElementById('statCorrect').textContent = correctIds.length;
  document.getElementById('statWrong').textContent = wrongEverIds.length;
  document.getElementById('statRate').textContent = doneIds.length > 0
    ? Math.round(correctIds.length / doneIds.length * 100) + '%'
    : '-';
  document.getElementById('headerInfo').textContent = `${doneIds.length}/${filtered.length}`;
  document.getElementById('progressFill').style.width = (doneIds.length / filtered.length * 100) + '%';
}

// ========== GRID ==========
function toggleGrid() {
  gridVisible = !gridVisible;
  document.getElementById('qGrid').style.display = gridVisible ? 'grid' : 'none';
  if (gridVisible) updateGrid();
}

function updateGrid() {
  const grid = document.getElementById('qGrid');
  grid.innerHTML = '';
  filteredQuestions.forEach((q, idx) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot';
    dot.textContent = q.id;
    dot.title = `${q.chapter} - 第${q.num}题`;
    if (history[q.id] && history[q.id].result === 'correct') dot.classList.add('done-correct');
    if (history[q.id] && history[q.id].result === 'wrong') dot.classList.add('done-wrong');
    if (history[q.id] && history[q.id].wrongEver) dot.classList.add('wrong-marked');
    dot.onclick = () => { currentIndex = idx; renderQuestion(); document.getElementById('questionCard').scrollIntoView({behavior:'smooth'}); };
    grid.appendChild(dot);
  });
  updateGridHighlight();
}

function updateGridHighlight() {
  const dots = document.querySelectorAll('.q-dot');
  dots.forEach((d, i) => {
    d.classList.toggle('current', i === currentIndex);
  });
}

// ========== HISTORY ==========
function saveHistory() {
  localStorage.setItem('prevmed_quiz_history', JSON.stringify(history));
}

function loadHistory() {
  const raw = localStorage.getItem('prevmed_quiz_history');
  if (raw) history = JSON.parse(raw);
}

function resetProgress() {
  if (confirm('确定要重置所有答题记录吗？此操作不可恢复。')) {
    history = {};
    localStorage.removeItem('prevmed_quiz_history');
    renderQuestion();
    updateStats();
    updateGrid();
  }
}

// ========== THEME ==========
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = isDark ? '白天模式' : '夜间模式';
  localStorage.setItem('prevmed_quiz_theme', isDark ? 'dark' : 'light');
}

(function loadTheme() {
  const saved = localStorage.getItem('prevmed_quiz_theme');
  if (saved === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = '白天模式';
  }
})();

// ========== KEYBOARD ==========
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight') nextQuestion();
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    showAnswer();
  }
  if (e.key >= '1' && e.key <= '5') {
    const idx = parseInt(e.key) - 1;
    const opts = document.querySelectorAll('.option');
    if (opts[idx]) opts[idx].click();
  }
});

// ========== START ==========
init();
</script>
